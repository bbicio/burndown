<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDash — Sign In</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/tokens.css?v=9">
  <link rel="stylesheet" href="css/auth.css?v=1">
</head>
<body>
  <div id="app" v-cloak>
    <div class="auth-stack">
    <div class="auth-card">

      <div class="auth-logo" :class="{ 'auth-logo--compact': view === 'forgot' }">
        <div class="auth-logo-row">
          <span class="auth-logo-mark" aria-hidden="true">P</span>
          <span class="auth-logo-name">Dash</span>
        </div>
        <div class="auth-logo-sub">Project Dashboard</div>
      </div>

      <!-- ── LOGIN FORM ─────────────────────────────────────────── -->
      <form v-if="view === 'login'" @submit.prevent="login" novalidate>
        <div v-if="error" class="alert alert-danger mb-3">{{ error }}</div>

        <div class="auth-field">
          <label class="form-label">Email</label>
          <input v-model="email" type="email" class="form-control" required
                 autocomplete="email" autofocus placeholder="you@company.com">
        </div>

        <div class="auth-field auth-field--24">
          <div class="d-flex justify-content-between align-items-center">
            <label class="form-label">Password</label>
            <a class="link-muted" @click="switchToForgot">Forgot password?</a>
          </div>
          <input v-model="password" type="password" class="form-control" required
                 autocomplete="current-password" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary w-100" :disabled="loading">
          <span v-if="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          Sign in
        </button>
      </form>

      <!-- ── FORGOT PASSWORD FORM ───────────────────────────────── -->
      <div v-else>
        <a class="link-muted auth-back" @click="switchToLogin">
          ← Back to sign in
        </a>
        <h6 class="auth-title">Reset your password</h6>
        <p class="auth-subtitle">Enter your email and we'll send you a link to reset your password.</p>

        <div v-if="error"   class="alert alert-danger mb-3">{{ error }}</div>
        <div v-if="success" class="alert alert-success mb-3">{{ success }}</div>

        <form @submit.prevent="forgotPassword" novalidate>
          <div class="auth-field auth-field--22">
            <label class="form-label">Email</label>
            <input v-model="forgotEmail" type="email" class="form-control" required
                   autocomplete="email" placeholder="you@company.com" :disabled="!!success">
          </div>
          <button type="submit" class="btn btn-primary w-100" :disabled="loading || !!success">
            <span v-if="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
            Send reset link
          </button>
        </form>
      </div>

    </div>
    <div class="auth-copyright">© {{ year }} PDash</div>
    </div>
  </div>

  <script defer src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script type="module">
    Vue.createApp({
      data() {
        return {
          view: 'login',
          email: '',
          password: '',
          forgotEmail: '',
          loading: false,
          error: null,
          success: null,
          year: new Date().getFullYear(),
        };
      },
      methods: {
        switchToForgot() { this.forgotEmail ||= this.email; this.view = 'forgot'; this.error = null; this.success = null; },
        switchToLogin()  { this.view = 'login';  this.error = null; this.success = null; },

        async login() {
          this.loading = true;
          this.error = null;
          try {
            const res = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'same-origin',
              body: JSON.stringify({ email: this.email, password: this.password }),
            });
            const data = await res.json();
            if (!res.ok) { this.error = data.error || 'Sign in failed. Please try again.'; return; }
            window.location.href = '/';
          } catch {
            this.error = 'Network error. Please try again.';
          } finally {
            this.loading = false;
          }
        },

        async forgotPassword() {
          this.loading = true;
          this.error = null;
          this.success = null;
          try {
            await fetch('/api/auth/forgot-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'same-origin',
              body: JSON.stringify({ email: this.forgotEmail }),
            });
            // Always show success — API never reveals if email exists
            this.success = 'If that email is registered, you\'ll receive a reset link shortly.';
          } catch {
            this.error = 'Network error. Please try again.';
          } finally {
            this.loading = false;
          }
        },
      },
    }).mount('#app');
  </script>
</body>
</html>
