<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem('PDash_sidebarCollapsed')==='1')document.documentElement.setAttribute('data-sidebar','collapsed')}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDash — Portfolio</title>
  <link rel="icon" type="image/png" href="https://ik.imagekit.io/6ezjgrjjf/00_Home_Page/letter-f.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/tokens.css?v=9">
  <link rel="stylesheet" href="css/style.css?v=21">
  <link rel="stylesheet" href="css/portfolio.css?v=1">
  <style>
    .app-container { padding: 0 12px; }
  </style>
</head>
<body>

<div id="app-shell">
<div id="nav-container"></div>
<div id="app-main">

<!-- Hidden per-project file input (actuals upload target) -->
<input type="file" id="fileInput" accept=".xls,.xlsx" style="display:none">

<div id="app" v-cloak class="app-container">

  <template v-if="view === 'overview'">
    <div class="pf-header">
      <div>
        <h1 class="pf-header-title">Project Portfolio</h1>
        <div class="pf-header-sub">{{ portfolioCounts }}</div>
      </div>
      <div class="pf-header-actions">
        <span :title="directCreationEnabled ? '' : directCreationMessage"><button class="btn btn-primary" :disabled="!directCreationEnabled" @click="goNewProject">+ New Project</button></span>
      </div>
    </div>

    <div v-if="notice" class="alert alert-info">{{ notice }}</div>
    <div v-if="!projects.length" class="alert alert-info">{{ directCreationEnabled ? 'No projects configured. Click ＋ New project to add one.' : 'No projects configured. Projects are created from a proposal (Generate project).' }}</div>

    <template v-else>
      <div class="pf-toolbar">
        <div class="pf-search">
          <pf-icon name="search" :size="14"></pf-icon>
          <input type="text" class="form-control form-control-sm" aria-label="Search projects"
                 placeholder="Search project, code or client…" v-model="portfolioSearch">
        </div>
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle pf-filter-btn" type="button"
                  data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
            Client: {{ portfolioClientFilter.length ? portfolioClientFilter.length + ' selected' : 'All' }}
          </button>
          <ul class="dropdown-menu p-2" style="max-height:280px;overflow-y:auto;min-width:200px">
            <li v-for="cid in allClientIds" :key="cid" class="form-check">
              <input class="form-check-input" type="checkbox" :id="'flt-client-' + cid" :value="cid" v-model="portfolioClientFilter">
              <label class="form-check-label" :for="'flt-client-' + cid" style="font-size:var(--text-sm)">{{ getClientName(cid) }}</label>
            </li>
          </ul>
        </div>
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle pf-filter-btn" type="button"
                  data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
            Stage: {{ portfolioStageFilter.length ? portfolioStageFilter.length + ' selected' : 'All' }}
          </button>
          <ul class="dropdown-menu p-2" style="max-height:280px;overflow-y:auto;min-width:200px">
            <li v-for="opt in stageFilterOptions" :key="opt" class="form-check">
              <input class="form-check-input" type="checkbox" :id="'flt-stage-' + opt" :value="opt" v-model="portfolioStageFilter">
              <label class="form-check-label" :for="'flt-stage-' + opt" style="font-size:var(--text-sm)">{{ opt }}</label>
            </li>
          </ul>
        </div>
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle pf-filter-btn" type="button"
                  data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
            Status: {{ portfolioStatusFilter.length ? portfolioStatusFilter.length + ' selected' : 'All' }}
          </button>
          <ul class="dropdown-menu p-2" style="max-height:280px;overflow-y:auto;min-width:200px">
            <li v-for="opt in statusFilterOptions" :key="opt" class="form-check">
              <input class="form-check-input" type="checkbox" :id="'flt-status-' + opt.replace(/\s+/g,'-')" :value="opt" v-model="portfolioStatusFilter">
              <label class="form-check-label" :for="'flt-status-' + opt.replace(/\s+/g,'-')" style="font-size:var(--text-sm)">{{ opt }}</label>
            </li>
          </ul>
        </div>
        <div class="pf-toolbar-spacer"></div>
        <div class="pf-sort">
          <span class="pf-sort-label">Sort:</span>
          <select class="form-select form-select-sm" v-model="portfolioSort" style="width:auto">
            <option value="client">Client A–Z</option>
            <option value="name">Alphabetical</option>
          </select>
        </div>
        <div class="pf-view-seg" role="group" aria-label="Layout">
          <button type="button" class="pf-view-btn" :class="{active: portfolioLayout === 'card'}" @click="setLayout('card')"><pf-icon name="grid" :size="14"></pf-icon> Card</button>
          <button type="button" class="pf-view-btn" :class="{active: portfolioLayout === 'list'}" @click="setLayout('list')"><pf-icon name="list" :size="14"></pf-icon> List</button>
        </div>
        <button v-if="portfolioFiltersActive" type="button" class="pf-clear-link" @click="clearPortfolioFilters">Clear filters</button>
      </div>

      <div v-if="!portfolioRows.length" class="alert alert-info">No projects match the current filters.</div>

      <!-- Budget Summary panel (pinned-project comparison table) hidden 2026-09 per user request, along with its ＋/✓ Summary toggle button in the detail header — toggleSummary()/pinnedSummary/portfolioSummaryProjects logic left intact for an easy restore
      <div class="section-card mb-4" style="border:2px solid var(--indigo-500)" v-if="pinnedSummary">
        <div class="section-header d-flex justify-content-between align-items-center flex-wrap gap-2" style="background:var(--indigo-50)">
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="fw-bold">📊 Budget Summary</span>
            <span class="small text-muted">{{ pinnedSummary.cfgs.length }} project{{ pinnedSummary.cfgs.length===1?'':'s' }}:</span>
            <span class="badge" v-for="c in pinnedSummary.cfgs" :key="c.id" style="background:var(--surface-medium);color:#495057;font-weight:500">{{ fmtProjectTitle(c) }}</span>
          </div>
        </div>
        <div class="table-responsive p-2">
          <table class="table table-sm align-middle mb-0" style="font-size:var(--text-base)">
            <thead style="background:var(--indigo-50)">
              <tr><th style="min-width:140px"></th><th v-for="ym in pinnedSummary.months" :key="ym" class="text-end" style="min-width:90px;white-space:nowrap">{{ monthLabel(ym) }}</th><th class="text-end fw-bold" style="min-width:100px;background:var(--portfolio-indigo-totals-bg)">Total</th></tr>
            </thead>
            <tbody>
              <tr style="background:var(--surface-light)"><td class="fw-semibold ps-2">Budget Estimated</td><td v-for="ym in pinnedSummary.months" :key="ym" class="text-end">{{ formatMoney(pinnedSummary.phasing[ym], 'EUR', currencies) }}</td><td class="text-end fw-bold" style="background:var(--portfolio-totals-bg)">{{ formatMoney(pinnedSummary.grandEst, 'EUR', currencies) }}</td></tr>
              <tr><td class="fw-semibold ps-2">Budget Spent</td><td v-for="ym in pinnedSummary.months" :key="ym" class="text-end">{{ formatMoney(pinnedSummary.spent[ym], 'EUR', currencies) }}</td><td class="text-end fw-bold" style="background:var(--portfolio-totals-bg)">{{ formatMoney(pinnedSummary.grandSpent, 'EUR', currencies) }}</td></tr>
              <tr><td class="fw-semibold ps-2">Variance</td><td v-for="ym in pinnedSummary.months" :key="ym" class="text-end fw-semibold" :style="{color: varColor(pinnedSummary.phasing[ym]-pinnedSummary.spent[ym])}">{{ fmtVar(pinnedSummary.phasing[ym]-pinnedSummary.spent[ym], 'EUR') }}</td><td class="text-end fw-bold" :style="{background:'var(--portfolio-totals-bg)',color: varColor(pinnedSummary.grandVar)}">{{ fmtVar(pinnedSummary.grandVar, 'EUR') }}</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      -->


      <div v-if="portfolioLayout === 'card'" class="pf-card-grid" ref="cardGrid" :style="{'--pf-cols': gridColumns}">
        <template v-for="(chunk, ci) in cardChunks" :key="ci">
          <div style="display:contents">
            <template v-for="row in chunk" :key="row.id">
              <!-- Program card -->
              <div v-if="row.kind === 'program'" class="pf-card pf-card-program" :class="{'pf-card-open': expandedProgramId === row.id}">
                <div class="pf-card-top">
                  <span class="pf-card-label">Program · {{ row.children.length }} project{{ row.children.length === 1 ? '' : 's' }}</span>
                  <span class="pf-stage-pill" v-html="pipelineBadge(row.pipeline)"></span>
                </div>
                <div class="pf-card-client" v-if="row.clientName">{{ row.clientName }}</div>
                <div class="pf-card-title">{{ row.name }}</div>
                <div class="pf-card-metrics">
                  <div><div class="pf-metric-label">Duration</div><div class="pf-metric-value">{{ row.duration ? (monthLabel(row.duration.start) + ' – ' + monthLabel(row.duration.end)) : '—' }}</div></div>
                  <div><div class="pf-metric-label">Sold</div><div class="pf-metric-value">{{ row.stats?.grandEst == null ? '—' : formatMoney(row.stats.grandEst, row.stats.currency, currencies) }}</div></div>
                  <div><div class="pf-metric-label">Spent</div><div class="pf-metric-value">{{ row.stats?.grandSpent == null ? '—' : formatMoney(row.stats.grandSpent, row.stats.currency, currencies) }}</div></div>
                  <div><div class="pf-metric-label">Variance</div><div class="pf-metric-value" :style="{color: row.stats ? varColor(row.stats.grandVar) : undefined}">{{ row.stats == null ? '—' : fmtVar(row.stats.grandVar, row.stats.currency) }}</div></div>
                </div>
                <div class="pf-card-divider"></div>
                <div class="pf-spent-bar" :class="'pf-spent-' + spentBarState(spentPercent(row.stats?.grandSpent ?? 0, row.stats?.grandEst ?? 0))">
                  <div class="pf-spent-bar-fill" :style="{width: Math.min(100, spentPercent(row.stats?.grandSpent ?? 0, row.stats?.grandEst ?? 0) || 0) + '%'}"></div>
                </div>
                <div class="pf-spent-label">{{ spentPercent(row.stats?.grandSpent ?? 0, row.stats?.grandEst ?? 0) === null ? 'No budget' : spentPercent(row.stats.grandSpent, row.stats.grandEst) + '% spent' }}</div>
                <div class="pf-card-footer">
                  <button class="btn btn-sm btn-outline-secondary" @click="openShareModal('program', row.id, row.name)">Share</button>
                  <div class="pf-card-actions">
                    <button v-if="!portfolioFiltersActive" class="btn btn-sm" :class="expandedProgramId === row.id ? 'btn-primary' : 'btn-outline-secondary'" @click="toggleProgramExpanded(row.id)">{{ expandedProgramId === row.id ? 'Hide projects' : 'Show ' + row.children.length + ' projects' }}</button>
                    <span v-else class="pf-shown-filtered" title="Program Dashboard — coming soon">Shown (filtered)</span>
                    <button class="btn btn-sm btn-outline-secondary" disabled title="Program Dashboard — coming soon">Dashboard</button>
                  </div>
                </div>
              </div>
              <!-- Project card -->
              <div v-else class="pf-card">
                <div class="pf-card-top">
                  <span class="pf-card-label">Project</span>
                  <span class="pf-stage-pill" v-html="pipelineBadge(getProjectPipeline(row.cfg.id) || row.cfg.pipeline)"></span>
                </div>
                <div class="pf-card-client" v-if="row.clientName">{{ row.clientName }}</div>
                <div class="pf-card-title">{{ fmtProjectTitle(row.cfg) }}</div>
                <div class="pf-card-code" v-if="row.cfg.code">{{ row.cfg.code }}</div>
                <div class="pf-card-metrics">
                  <div><div class="pf-metric-label">Duration</div><div class="pf-metric-value">{{ row.card.hasDuration ? (monthLabel(row.cfg.startDate) + ' – ' + monthLabel(row.cfg.endDate)) : '—' }}</div></div>
                  <div><div class="pf-metric-label">Sold</div><div class="pf-metric-value">{{ (row.card.hasDuration && row.card.hasPhasing) ? formatMoney(row.card.totalPhasing, row.cfg.currency || 'EUR', currencies) : '—' }}</div></div>
                  <div><div class="pf-metric-label">Spent</div><div class="pf-metric-value">{{ (row.card.hasDuration && row.card.hasData) ? formatMoney(row.card.totalSpent, row.cfg.currency || 'EUR', currencies) : '—' }}</div></div>
                  <div><div class="pf-metric-label">Variance</div><div class="pf-metric-value" :style="{color: (row.card.hasDuration && row.card.hasData && row.card.hasPhasing) ? varColor(row.card.totalVar) : undefined}">{{ (row.card.hasDuration && row.card.hasData && row.card.hasPhasing) ? fmtVar(row.card.totalVar, row.cfg.currency || 'EUR') : '—' }}</div></div>
                </div>
                <div class="pf-card-divider"></div>
                <div class="pf-spent-bar" :class="'pf-spent-' + spentBarState(cardSpentPct(row.card))">
                  <div class="pf-spent-bar-fill" :style="{width: Math.min(100, cardSpentPct(row.card) || 0) + '%'}"></div>
                </div>
                <div class="pf-spent-label">{{ cardSpentLabel(cardSpentPct(row.card)) }}</div>
                <div class="pf-card-footer">
                  <span v-html="statusBadgeLarge(row.cfg.status)" class="pf-status-pill"></span>
                  <div class="pf-card-actions">
                    <button v-if="row.cfg.my_permission !== 'viewer'" class="btn btn-sm btn-outline-secondary" @click="goConfigure(row.cfg.id)">Configure</button>
                    <button class="btn btn-sm btn-primary" @click="showDashboard(row.cfg.id)">Dashboard</button>
                  </div>
                </div>
              </div>
            </template>
          </div>
          <!-- Full-width children panel, placed after the entire row that contains the open program (§13) -->
          <div v-if="expandedProgram && chunk.some(r => r.id === expandedProgram.id && r.kind === 'program')" class="pf-children-panel">
            <div class="pf-children-panel-head">
              <div>
                <div class="pf-children-panel-title">{{ expandedProgram.name }}</div>
                <div class="pf-children-panel-sub">Program · {{ expandedProgram.children.length }} project{{ expandedProgram.children.length === 1 ? '' : 's' }}</div>
              </div>
              <div class="pf-children-panel-actions">
                <button class="pf-clear-link" disabled title="Program Dashboard — coming soon">Program Dashboard →</button>
                <button class="pf-clear-link" @click="expandedProgramId = null">Close</button>
              </div>
            </div>
            <div class="pf-children-grid">
              <div v-for="cfg in expandedProgram.children" :key="cfg.id" class="pf-mini-card">
                <div class="pf-mini-card-name">{{ cfg.name || cfg.id }}</div>
                <div class="pf-mini-card-code" v-if="cfg.code">{{ cfg.code }}</div>
                <span v-html="statusBadgeLarge(cfg.status)" class="pf-status-pill"></span>
                <div class="pf-mini-card-amounts">{{ fmtK(cardDataMap[cfg.id].totalSpent, cfg.currency || 'EUR') }} / {{ fmtK(cardDataMap[cfg.id].totalPhasing, cfg.currency || 'EUR') }}</div>
                <div class="pf-spent-bar pf-spent-thin" :class="'pf-spent-' + spentBarState(cardSpentPct(cardDataMap[cfg.id]))">
                  <div class="pf-spent-bar-fill" :style="{width: Math.min(100, cardSpentPct(cardDataMap[cfg.id]) || 0) + '%'}"></div>
                </div>
                <div class="pf-mini-card-footer">
                  <button v-if="cfg.my_permission !== 'viewer'" class="pf-clear-link" @click="goConfigure(cfg.id)">Configure</button>
                  <button class="pf-clear-link" @click="showDashboard(cfg.id)">Dashboard →</button>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>
  </template>

  <template v-else>
    <div class="pt-4 mb-3">
      <nav aria-label="breadcrumb" class="mb-2">
        <ol class="breadcrumb mb-0" style="font-size:var(--text-xs)">
          <li class="breadcrumb-item"><a href="#" class="text-muted text-decoration-none" @click.prevent="showOverview">Portfolio</a></li>
          <li class="breadcrumb-item active text-muted" aria-current="page">{{ dashboardProject?.name || dashboardProject?.code || dashboardProjectId }}</li>
        </ol>
      </nav>
      <div v-if="dashboardProgramRow" class="text-muted mb-1" style="font-size:.9rem" v-html="dashboardProgramRow"></div>
      <div class="d-flex align-items-center gap-2 flex-wrap mb-2">
        <span class="fw-bold fs-5" style="color:var(--brand-navy)">{{ dashboardProject?.name || dashboardProject?.code || dashboardProjectId }}</span>
        <span v-if="dashboardProject?.code && dashboardProject?.name" class="text-muted small" style="font-family:monospace">{{ dashboardProject.code }}</span>
        <span class="d-inline-flex gap-1 align-items-center flex-wrap" v-html="dashboardMetaHtml"></span>
        <div class="dropdown" v-if="dashboardSiblings.length">
          <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="font-size:.75rem;padding:2px 7px" title="Switch project">▾</button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm" style="min-width:320px;font-size:.85rem">
            <li v-for="s in dashboardSiblings" :key="s.id">
              <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#" @click.prevent="showDashboard(s.id)">
                <span class="fw-semibold">{{ s.name || s.code || s.id }}</span>
                <span v-if="s.code && s.name" class="text-muted small" style="font-family:monospace">{{ s.code }}</span>
                <span class="ms-auto d-inline-flex gap-1" v-html="s.badgesHtml"></span>
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
        <div><button class="btn btn-outline-secondary btn-sm" @click="showOverview">← Portfolio</button></div>
        <div class="d-flex gap-2">
          <button v-if="dashboardProject?.my_permission !== 'viewer'" class="btn btn-outline-secondary btn-sm" @click="goConfigure(dashboardProjectId)">⚙️ Configure</button>
          <button v-if="dashboardProject?.my_permission !== 'viewer'" class="btn btn-outline-secondary btn-sm" title="Upload XLS actuals for this project" @click="triggerLoadActuals(dashboardProjectId)">📂 Load Actuals</button>
          <button class="btn btn-outline-secondary btn-sm" @click="goPlanningForProject(dashboardProjectId)">📅 Planning</button>
          <button class="btn btn-outline-secondary btn-sm" @click="openShareModal('project', dashboardProjectId, dashboardProject?.name || dashboardProjectId)">🔗 Share</button>
          <!-- ＋/✓ Summary toggle hidden 2026-09 per user request, see the matching pinnedSummary panel comment above
          <button class="btn btn-sm" :class="isPinnedSummary(dashboardProjectId) ? 'btn-success' : 'btn-outline-secondary'" @click="toggleSummary(dashboardProjectId)">{{ isPinnedSummary(dashboardProjectId) ? '✓ Summary' : '＋ Summary' }}</button>
          -->
        </div>
      </div>
    </div>

    <div v-if="dashboardReady">
      <div v-if="!dashboardProject" class="alert alert-warning">
        <strong>⚠️ Budget not configured for this project.</strong>
        Click <strong>⚙️ Configure Budget</strong> to enter sold hours and hourly rates.
      </div>
      <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-2"><div class="card kpi-card blue shadow-sm h-100"><div class="card-body py-3 px-3"><div class="text-muted small mb-1">📦 Total Sold Hours</div><div class="fw-bold fs-4">{{ kpis.soldHours !== null ? fmtH(kpis.soldHours) : '—' }}</div><div class="text-muted small">from configuration</div></div></div></div>
        <div class="col-sm-6 col-xl-2"><div class="card kpi-card green shadow-sm h-100"><div class="card-body py-3 px-3"><div class="text-muted small mb-1">💰 Total Budget</div><div class="fw-bold fs-4">{{ kpis.budgetTotal !== null ? formatMoney(kpis.budgetTotal, dashCurrency, currencies) : '—' }}</div><div class="text-muted small">{{ kpiBudgetEurSub }}</div></div></div></div>
        <div class="col-sm-6 col-xl-2"><div class="card kpi-card orange shadow-sm h-100"><div class="card-body py-3 px-3"><div class="text-muted small mb-1">⏱️ Hours Consumed</div><div class="fw-bold fs-4">{{ fmtH(kpis.consumedHours) }}</div><div class="text-muted small">{{ kpiAsOfStr }}</div></div></div></div>
        <div class="col-sm-6 col-xl-2"><div class="card kpi-card purple shadow-sm h-100"><div class="card-body py-3 px-3"><div class="text-muted small mb-1">💸 Budget Consumed</div><div class="fw-bold fs-4">{{ kpis.consumedEur !== null ? formatMoney(kpis.consumedEur, dashCurrency, currencies) : '—' }}</div><div class="text-muted small">{{ kpiAsOfStr }}</div></div></div></div>
        <div class="col-sm-6 col-xl-2"><div class="card kpi-card teal shadow-sm h-100"><div class="card-body py-3 px-3"><div class="text-muted small mb-1">⏳ Hours Left</div><div class="fw-bold fs-4" :style="{color: kpiLeftColor(kpis.hoursLeft, kpis.soldHours)}">{{ kpis.hoursLeft !== null ? fmtH(kpis.hoursLeft) : '—' }}</div><div class="text-muted small">sold − consumed</div></div></div></div>
        <div class="col-sm-6 col-xl-2"><div class="card kpi-card red shadow-sm h-100"><div class="card-body py-3 px-3"><div class="text-muted small mb-1">💼 Budget Left</div><div class="fw-bold fs-4" :style="{color: kpiLeftColor(kpis.budgetLeft, kpis.budgetTotal)}">{{ kpis.budgetLeft !== null ? formatMoney(kpis.budgetLeft, dashCurrency, currencies) : '—' }}</div><div class="text-muted small">{{ kpiBudgetLeftSub }}</div></div></div></div>
      </div>
      <div class="section-card mb-4">
        <div class="section-header d-flex justify-content-between align-items-center flex-wrap gap-2">
          <span>📉 Hours Burndown</span>
          <div class="d-flex align-items-center gap-3 flex-wrap">
            <div class="btn-group btn-group-sm">
              <button v-for="opt in ['monthly','quarterly','biweekly','weekly']" :key="opt" class="btn btn-outline-secondary" :class="{active: burndownInterval === opt}" @click="burndownInterval = opt">{{ opt.charAt(0).toUpperCase() + opt.slice(1) }}</button>
            </div>
            <div class="d-flex align-items-center gap-2">
              <label class="small text-muted mb-0 fw-normal">Filter by task:</label>
              <select class="form-select form-select-sm" v-model="burndownTaskFilter" style="min-width:220px">
                <option value="">All tasks</option>
                <option v-for="t in billableTaskNames" :key="t" :value="t">{{ t }}</option>
              </select>
            </div>
            <button class="btn btn-outline-secondary btn-sm" title="Export chart as PNG" @click="exportChartPng">🖼 Export PNG</button>
          </div>
        </div>
        <div class="p-3"><div class="chart-container"><canvas ref="burndownCanvas"></canvas></div></div>
      </div>
      <div class="section-card mb-4" v-if="monthlySummary">
        <div class="section-header d-flex justify-content-between align-items-center">
          <span>📅 Monthly Summary — hours and budget spent by month</span>
          <ExportButtons :tbl-ref="() => $refs.monthlyTable" filename="monthly_summary" :card-ref="() => $refs.monthlyCard" />
        </div>
        <div class="table-responsive" ref="monthlyCard">
          <table ref="monthlyTable" class="table table-sm table-hover align-middle mb-0 tbl-fixed">
            <thead style="background:var(--surface-light);">
              <tr>
                <th class="ps-3" rowspan="2" style="vertical-align:middle;border-bottom:2px solid var(--border-light)">Month</th>

        <div class="table-responsive" ref="summaryByTaskCard">
          <table ref="summaryByTaskTable" class="table table-sm align-middle mb-0 tbl-fixed">

              <tr><td class="ps-3 fw-semibold">Spent</td><td v-for="c in summaryByTask" :key="c.label" class="text-end">{{ fmtH(filterHasFilter ? c.totalConsumed - c.inPeriod : c.totalConsumed) }}<span class="eur-sub">{{ formatMoney(filterHasFilter ? c.totalConsumedEur - c.inPeriodEur : c.totalConsumedEur, dashCurrency, currencies) }}</span></td><td class="text-end pe-3 fw-bold">{{ fmtH(summaryTotals(summaryByTask, filterHasFilter).totSpent) }}<span class="eur-sub">{{ formatMoney(summaryTotals(summaryByTask, filterHasFilter).totSpentEur, dashCurrency, currencies) }}</span></td></tr>
              <tr><td class="ps-3 fw-semibold">In period <span v-if="filterHasFilter" class="fw-normal text-muted">({{ filterRangeLabel }})</span></td><td v-for="c in summaryByTask" :key="c.label" class="text-end">{{ filterHasFilter ? fmtH(c.inPeriod) : '—' }}<span v-if="filterHasFilter" class="eur-sub">{{ c.inPeriodEur == null ? '—' : formatMoney(c.inPeriodEur, dashCurrency, currencies) }}</span></td><td class="text-end pe-3 fw-bold">{{ filterHasFilter ? fmtH(summaryTotals(summaryByTask, filterHasFilter).totInPeriod) : '—' }}</td></tr>
              <tr style="background:var(--surface-medium);"><td class="ps-3 fw-bold">Residual</td><td v-for="c in summaryByTask" :key="c.label" class="text-end" :class="{'fw-bold text-danger': (c.soldHours - c.totalConsumed) < 0}">{{ fmtH(c.soldHours - c.totalConsumed) }}<span class="eur-sub">{{ formatMoney(c.soldEur - c.totalConsumedEur, dashCurrency, currencies) }}</span></td><td class="text-end pe-3 fw-bold" :class="{'text-danger': summaryTotals(summaryByTask, filterHasFilter).totResidual < 0}">{{ fmtH(summaryTotals(summaryByTask, filterHasFilter).totResidual) }}<span class="eur-sub">{{ formatMoney(summaryTotals(summaryByTask, filterHasFilter).totResidualEur, dashCurrency, currencies) }}</span></td></tr>
            </tbody>
          </table>
        </div>
      </div>

          <span>📊 Summary by role</span>

        </div>
        <div class="table-responsive" ref="summaryByRoleCard">
          <table ref="summaryByRoleTable" class="table table-sm align-middle mb-0 tbl-fixed">

            <tbody>
              <tr><td class="ps-3 fw-semibold">Total Amount</td><td v-for="c in summaryByRole" :key="c.label" class="text-end">{{ fmtH(c.soldHours) }}<span class="eur-sub">{{ c.soldEur == null ? '—' : formatMoney(c.soldEur, dashCurrency, currencies) }}</span></td><td class="text-end pe-3 fw-bold">{{ fmtH(summaryTotals(summaryByRole, filterHasFilter).totSold) }}<span class="eur-sub">{{ formatMoney(summaryTotals(summaryByRole, filterHasFilter).totSoldEur, dashCurrency, currencies) }}</span></td></tr>
              <tr><td class="ps-3 fw-semibold">Spent</td><td v-for="c in summaryByRole" :key="c.label" class="text-end">{{ fmtH(filterHasFilter ? c.totalConsumed - c.inPeriod : c.totalConsumed) }}<span class="eur-sub">{{ formatMoney(filterHasFilter ? c.totalConsumedEur - c.inPeriodEur : c.totalConsumedEur, dashCurrency, currencies) }}</span></td><td class="text-end pe-3 fw-bold">{{ fmtH(summaryTotals(summaryByRole, filterHasFilter).totSpent) }}<span class="eur-sub">{{ formatMoney(summaryTotals(summaryByRole, filterHasFilter).totSpentEur, dashCurrency, currencies) }}</span></td></tr>

          <ExportButtons :tbl-ref="() => $refs.summaryByGroupTable" filename="summary_by_group" :card-ref="() => $refs.summaryByGroupCard" />
        </div>
        <div class="table-responsive" ref="summaryByGroupCard">
          <table ref="summaryByGroupTable" class="table table-sm align-middle mb-0 tbl-fixed">
            <thead style="background:var(--surface-light);"><tr><th class="ps-3"></th><th v-for="c in summaryByGroup" :key="c.label" class="text-end small">{{ c.label }}</th><th class="text-end pe-3 fw-bold">TOTAL</th></tr></thead>
            <tbody>
              <tr><td class="ps-3 fw-semibold">Total Amount</td><td v-for="c in summaryByGroup" :key="c.label" class="text-end">{{ fmtH(c.soldHours) }}<span class="eur-sub">{{ c.soldEur == null ? '—' : formatMoney(c.soldEur, dashCurrency, currencies) }}</span></td><td class="text-end pe-3 fw-bold">{{ fmtH(summaryTotals(summaryByGroup, filterHasFilter).totSold) }}<span class="eur-sub">{{ formatMoney(summaryTotals(summaryByGroup, filterHasFilter).totSoldEur, dashCurrency, currencies) }}</span></td></tr>
              <tr><td class="ps-3 fw-semibold">Spent</td><td v-for="c in summaryByGroup" :key="c.label" class="text-end">{{ fmtH(filterHasFilter ? c.totalConsumed - c.inPeriod : c.totalConsumed) }}<span class="eur-sub">{{ formatMoney(filterHasFilter ? c.totalConsumedEur - c.inPeriodEur : c.totalConsumedEur, dashCurrency, currencies) }}</span></td><td class="text-end pe-3 fw-bold">{{ fmtH(summaryTotals(summaryByGroup, filterHasFilter).totSpent) }}<span class="eur-sub">{{ formatMoney(summaryTotals(summaryByGroup, filterHasFilter).totSpentEur, dashCurrency, currencies) }}</span></td></tr>

              <tr style="background:var(--surface-medium);"><td class="ps-3 fw-bold">Residual</td><td v-for="c in summaryByGroup" :key="c.label" class="text-end" :class="{'fw-bold text-danger': (c.soldHours - c.totalConsumed) < 0}">{{ fmtH(c.soldHours - c.totalConsumed) }}<span class="eur-sub">{{ formatMoney(c.soldEur - c.totalConsumedEur, dashCurrency, currencies) }}</span></td><td class="text-end pe-3 fw-bold" :class="{'text-danger': summaryTotals(summaryByGroup, filterHasFilter).totResidual < 0}">{{ fmtH(summaryTotals(summaryByGroup, filterHasFilter).totResidual) }}<span class="eur-sub">{{ formatMoney(summaryTotals(summaryByGroup, filterHasFilter).totResidualEur, dashCurrency, currencies) }}</span></td></tr>

          <span>📋 {{ entry.task.name }}<span v-if="entry.task.billable === false" class="badge bg-secondary ms-1" style="font-size:var(--text-xs);vertical-align:middle;">Excluded from report</span></span>
          <div class="d-flex gap-2 align-items-center">
            <button class="btn btn-sm btn-outline-secondary" @click="taskState(entry.task.name).expanded = !taskState(entry.task.name).expanded">{{ taskState(entry.task.name).expanded ? '▲ Close details' : '▶ Expand details' }}</button>
            <ExportButtons :tbl-ref="() => $refs['taskTable_'+entry.task.name]?.[0]" :filename="'task_'+entry.task.name.replace(/[^a-zA-Z0-9]/g,'_')" :card-ref="() => $refs['taskCard_'+entry.task.name]?.[0]" />
          </div>
        </div>
        <div class="table-responsive" :ref="'taskCard_'+entry.task.name">
          <table :ref="'taskTable_'+entry.task.name" class="table table-sm table-hover align-middle mb-0 task-sum-tbl" style="table-layout:fixed;width:100%">

                <td class="text-end">{{ r.soldHours !== null ? fmtH(r.soldHours) : '—' }}<span v-if="r.soldEur !== null" class="eur-sub">{{ formatMoney(r.soldEur, dashCurrency, currencies) }}</span></td>
                <td class="text-end">{{ fmtH(r.consumedPeriod) }}<span class="eur-sub">{{ r.consumedPeriodEur == null ? '—' : formatMoney(r.consumedPeriodEur, dashCurrency, currencies) }}</span></td>
                <td class="text-end pe-3" :class="{'fw-bold text-danger': r.remaining !== null && r.remaining < 0}">{{ r.remaining !== null ? fmtH(r.remaining) : '—' }}<span v-if="r.remainingEur !== null" class="eur-sub" :class="{danger: r.remainingEur < 0}">{{ formatMoney(r.remainingEur, dashCurrency, currencies) }}</span></td>
              </tr>
              <tr class="fw-bold" style="background:var(--surface-medium);">
                <td class="ps-3">TOTAL</td>

                <td class="text-end pe-3" :class="{'text-danger': entry.totRemaining < 0}">{{ fmtH(entry.totRemaining) }}<span class="eur-sub" :class="{danger: entry.totRemainingEur < 0}">{{ entry.totRemainingEur == null ? '—' : formatMoney(entry.totRemainingEur, dashCurrency, currencies) }}</span></td>

              </div>
              <ExportButtons :tbl-ref="() => $refs['detTable_'+entry.task.name]?.[0]" :filename="'task_'+entry.task.name.replace(/[^a-zA-Z0-9]/g,'_')+'_detail'" :card-ref="() => $refs['detSection_'+entry.task.name]?.[0]" />
            </div>
          </div>
          <div class="table-responsive" :ref="'detSection_'+entry.task.name">
            <table :ref="'detTable_'+entry.task.name" class="table table-sm align-middle mb-0 det-tbl" style="table-layout:fixed;width:100%">

              <thead style="background:var(--indigo-50);"><tr><th class="ps-3">Date</th><th>{{ taskState(entry.task.name).groupMode === 'flat' ? 'Role (Resource)' : taskState(entry.task.name).groupMode === 'role' ? 'Owner' : 'Role' }}</th><th class="text-end">Hours</th><th>Notes</th></tr></thead>

                  <tr v-if="row.isGroupHeader" :style="{background: taskState(entry.task.name).groupMode === 'role' ? 'var(--indigo-50)' : 'var(--color-warning-bg)'}">
                    <td class="ps-3 fw-semibold small" colspan="2">{{ row.label }}</td>
                    <td class="text-end fw-semibold small">{{ fmtH(row.hours) }}<span class="eur-sub">{{ row.eur == null ? '—' : formatMoney(row.eur, dashCurrency, currencies) }}</span></td>

                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    <div class="mt-4 mb-4"><button class="btn btn-outline-secondary btn-sm" @click="showOverview">← Portfolio</button></div>

<script type="module" src="js/lib/notif-browser.js?v=2"></script>
<script type="module" src="js/lib/money.js?v=2"></script>
<script type="module" src="js/lib/project-rules.js?v=1"></script>
