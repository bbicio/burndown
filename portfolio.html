<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem('PDash_sidebarCollapsed')==='1')document.documentElement.setAttribute('data-sidebar','collapsed')}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDash — Portfolio</title>
  <link rel="icon" type="image/png" href="https://ik.imagekit.io/6ezjgrjjf/00_Home_Page/letter-f.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/tokens.css?v=13">
  <link rel="stylesheet" href="css/style.css?v=30">
  <link rel="stylesheet" href="css/controls.css?v=1">
  <link rel="stylesheet" href="css/portfolio.css?v=9">
</head>
<body>

<div id="app-shell">
<div id="nav-container"></div>
<div id="app-main">

<!-- Hidden per-project file input (actuals upload target) -->
<input type="file" id="fileInput" accept=".xls,.xlsx" style="display:none">

<div id="app" v-cloak class="app-container">

  <template v-if="view === 'overview'">
    <div class="ph">
      <div class="ph-main">
        <h1 class="ph-title">Portfolio</h1>
        <div class="ph-sub">{{ portfolioCounts }}</div>
      </div>
      <div class="ph-side">
        <span :title="directCreationEnabled ? '' : directCreationMessage"><button class="ph-btn-primary" :disabled="!directCreationEnabled" @click="goNewProject">+ New Project</button></span>
      </div>
    </div>

    <div v-if="notice" class="alert alert-info">{{ notice }}</div>
    <div v-if="!projects.length" class="alert alert-info">{{ directCreationEnabled ? 'No projects configured. Click ＋ New project to add one.' : 'No projects configured. Projects are created from a proposal (Generate project).' }}</div>

    <template v-else>
      <div class="ph-toolbar">
        <div class="pf-search">
          <ph-icon name="search" :size="14"></ph-icon>
          <input type="text" class="form-control form-control-sm" aria-label="Search projects"
                 placeholder="Search project, code or client…" v-model="portfolioSearch">
        </div>
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle pf-filter-btn" type="button"
                  data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
            Client: {{ portfolioClientFilter.length ? portfolioClientFilter.length + ' selected' : 'All' }}
          </button>
          <ul class="dropdown-menu p-2" style="max-height:280px;overflow-y:auto;min-width:200px">
            <li v-for="cid in allClientIds" :key="cid" class="form-check">
              <input class="form-check-input" type="checkbox" :id="'flt-client-' + cid" :value="cid" v-model="portfolioClientFilter">
              <label class="form-check-label" :for="'flt-client-' + cid" style="font-size:var(--text-sm)">{{ getClientName(cid) }}</label>
            </li>
          </ul>
        </div>
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle pf-filter-btn" type="button"
                  data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
            Stage: {{ portfolioStageFilter.length ? portfolioStageFilter.length + ' selected' : 'All' }}
          </button>
          <ul class="dropdown-menu p-2" style="max-height:280px;overflow-y:auto;min-width:200px">
            <li v-for="opt in stageFilterOptions" :key="opt" class="form-check">
              <input class="form-check-input" type="checkbox" :id="'flt-stage-' + opt" :value="opt" v-model="portfolioStageFilter">
              <label class="form-check-label" :for="'flt-stage-' + opt" style="font-size:var(--text-sm)">{{ opt }}</label>
            </li>
          </ul>
        </div>
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle pf-filter-btn" type="button"
                  data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
            Status: {{ portfolioStatusFilter.length ? portfolioStatusFilter.length + ' selected' : 'All' }}
          </button>
          <ul class="dropdown-menu p-2" style="max-height:280px;overflow-y:auto;min-width:200px">
            <li v-for="opt in statusFilterOptions" :key="opt" class="form-check">
              <input class="form-check-input" type="checkbox" :id="'flt-status-' + opt.replace(/\s+/g,'-')" :value="opt" v-model="portfolioStatusFilter">
              <label class="form-check-label" :for="'flt-status-' + opt.replace(/\s+/g,'-')" style="font-size:var(--text-sm)">{{ opt }}</label>
            </li>
          </ul>
        </div>
        <div class="ph-toolbar-spacer"></div>
        <div class="pf-sort">
          <span class="pf-sort-label">Sort:</span>
          <select class="form-select form-select-sm" v-model="portfolioSort" style="width:auto">
            <option value="client">Client A–Z</option>
            <option value="name">Alphabetical</option>
          </select>
        </div>
        <div class="pf-view-seg" role="group" aria-label="Layout">
          <button type="button" class="pf-view-btn" :class="{active: portfolioLayout === 'card'}" @click="setLayout('card')"><ph-icon name="grid" :size="14"></ph-icon> Card</button>
          <button type="button" class="pf-view-btn" :class="{active: portfolioLayout === 'list'}" @click="setLayout('list')"><ph-icon name="list" :size="14"></ph-icon> List</button>
        </div>
        <button v-if="portfolioFiltersActive" type="button" class="pf-clear-link" @click="clearPortfolioFilters">Clear filters</button>
      </div>

      <div v-if="!portfolioRows.length" class="alert alert-info">No projects match the current filters.</div>

      <!-- Budget Summary panel (pinned-project comparison table) hidden 2026-09 per user request, along with its ＋/✓ Summary toggle button in the detail header — toggleSummary()/pinnedSummary/portfolioSummaryProjects logic left intact for an easy restore
      <div class="section-card mb-4" style="border:2px solid var(--indigo-500)" v-if="pinnedSummary">
        <div class="section-header d-flex justify-content-between align-items-center flex-wrap gap-2" style="background:var(--indigo-50)">
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="fw-bold">📊 Budget Summary</span>
            <span class="small text-muted">{{ pinnedSummary.cfgs.length }} project{{ pinnedSummary.cfgs.length===1?'':'s' }}:</span>
            <span class="badge" v-for="c in pinnedSummary.cfgs" :key="c.id" style="background:var(--surface-medium);color:#495057;font-weight:500">{{ fmtProjectTitle(c) }}</span>
          </div>
        </div>
        <div class="table-responsive p-2">
          <table class="table table-sm align-middle mb-0" style="font-size:var(--text-base)">
            <thead style="background:var(--indigo-50)">
              <tr><th style="min-width:140px"></th><th v-for="ym in pinnedSummary.months" :key="ym" class="text-end" style="min-width:90px;white-space:nowrap">{{ monthLabel(ym) }}</th><th class="text-end fw-bold" style="min-width:100px;background:var(--portfolio-indigo-totals-bg)">Total</th></tr>
            </thead>
            <tbody>
              <tr style="background:var(--surface-light)"><td class="fw-semibold ps-2">Budget Estimated</td><td v-for="ym in pinnedSummary.months" :key="ym" class="text-end">{{ formatMoney(pinnedSummary.phasing[ym], 'EUR', currencies) }}</td><td class="text-end fw-bold" style="background:var(--portfolio-totals-bg)">{{ formatMoney(pinnedSummary.grandEst, 'EUR', currencies) }}</td></tr>
              <tr><td class="fw-semibold ps-2">Budget Spent</td><td v-for="ym in pinnedSummary.months" :key="ym" class="text-end">{{ formatMoney(pinnedSummary.spent[ym], 'EUR', currencies) }}</td><td class="text-end fw-bold" style="background:var(--portfolio-totals-bg)">{{ formatMoney(pinnedSummary.grandSpent, 'EUR', currencies) }}</td></tr>
              <tr><td class="fw-semibold ps-2">Variance</td><td v-for="ym in pinnedSummary.months" :key="ym" class="text-end fw-semibold" :style="{color: varColor(pinnedSummary.phasing[ym]-pinnedSummary.spent[ym])}">{{ fmtVar(pinnedSummary.phasing[ym]-pinnedSummary.spent[ym], 'EUR') }}</td><td class="text-end fw-bold" :style="{background:'var(--portfolio-totals-bg)',color: varColor(pinnedSummary.grandVar)}">{{ fmtVar(pinnedSummary.grandVar, 'EUR') }}</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      -->


      <div v-if="portfolioLayout === 'card'" class="pf-card-grid" ref="cardGrid" :style="{'--pf-cols': gridColumns}">
        <template v-for="(chunk, ci) in cardChunks" :key="ci">
          <div style="display:contents">
            <template v-for="row in chunk" :key="row.id">
              <!-- Program card -->
              <div v-if="row.kind === 'program'" class="pf-card pf-card-program" :class="{'pf-card-open': expandedProgramIds.has(row.id)}">
                <div class="pf-card-top">
                  <span class="pf-card-label">Program · {{ row.children.length }} project{{ row.children.length === 1 ? '' : 's' }}</span>
                  <span class="pf-stage-pill" v-html="pipelineBadge(row.pipeline)"></span>
                </div>
                <div class="pf-card-client" v-if="row.clientName">{{ row.clientName }}</div>
                <div class="pf-card-title">{{ row.name }}</div>
                <div class="pf-card-metrics">
                  <div><div class="pf-metric-label">Duration</div><div class="pf-metric-value">{{ row.duration ? (monthLabel(row.duration.start) + ' – ' + monthLabel(row.duration.end)) : '—' }}</div></div>
                  <div><div class="pf-metric-label">Sold</div><div class="pf-metric-value">{{ row.stats?.grandEst == null ? '—' : formatMoney(row.stats.grandEst, row.stats.currency, currencies) }}</div></div>
                  <div><div class="pf-metric-label">Spent</div><div class="pf-metric-value">{{ row.stats?.grandSpent == null ? '—' : formatMoney(row.stats.grandSpent, row.stats.currency, currencies) }}</div></div>
                  <div><div class="pf-metric-label">Variance</div><div class="pf-metric-value" :style="{color: row.stats ? varColor(row.stats.grandVar) : undefined}">{{ row.stats == null ? '—' : fmtVar(row.stats.grandVar, row.stats.currency) }}</div></div>
                </div>
                <div class="pf-card-divider"></div>
                <div class="pf-spent-bar" :class="'pf-spent-' + spentBarState(spentPercent(row.stats?.grandSpent ?? 0, row.stats?.grandEst ?? 0))">
                  <div class="pf-spent-bar-fill" :style="{width: Math.min(100, spentPercent(row.stats?.grandSpent ?? 0, row.stats?.grandEst ?? 0) || 0) + '%'}"></div>
                </div>
                <div class="pf-spent-label">{{ spentPercent(row.stats?.grandSpent ?? 0, row.stats?.grandEst ?? 0) === null ? 'No budget' : spentPercent(row.stats.grandSpent, row.stats.grandEst) + '% spent' }}</div>
                <div class="pf-card-footer">
                  <button class="btn btn-sm btn-outline-secondary" @click="openShareModal('program', row.id, row.name)">Share</button>
                  <div class="pf-card-actions">
                    <button v-if="!portfolioFiltersActive" class="btn btn-sm" :class="expandedProgramId === row.id ? 'pf-btn-navy' : 'btn-outline-secondary'" @click="toggleProgramExpanded(row.id)">{{ expandedProgramId === row.id ? 'Hide projects' : 'Show ' + row.children.length + ' projects' }}</button>
                    <span v-else class="pf-shown-filtered">Shown (filtered)</span>
                    <button class="btn btn-sm btn-outline-secondary" @click="goProgramDashboard(row.id)">Dashboard</button>
                  </div>
                </div>
              </div>
              <!-- Project card -->
              <div v-else class="pf-card">
                <div class="pf-card-top">
                  <span class="pf-card-label">Project</span>
                  <span class="pf-stage-pill" v-html="pipelineBadge(getProjectPipeline(row.cfg.id) || row.cfg.pipeline)"></span>
                </div>
                <div class="pf-card-client" v-if="row.clientName">{{ row.clientName }}</div>
                <div class="pf-card-title">{{ fmtProjectTitle(row.cfg) }}</div>
                <div class="pf-card-code" v-if="row.cfg.code">{{ row.cfg.code }}</div>
                <span v-if="!row.card.hasData" class="pf-badge-neutral">No actuals available</span>
                <div class="pf-card-metrics">
                  <div><div class="pf-metric-label">Duration</div><div class="pf-metric-value">{{ row.card.hasDuration ? (monthLabel(row.cfg.startDate) + ' – ' + monthLabel(row.cfg.endDate)) : '—' }}</div></div>
                  <div><div class="pf-metric-label">Sold</div><div class="pf-metric-value">{{ (row.card.hasDuration && row.card.hasPhasing) ? formatMoney(row.card.totalPhasing, row.cfg.currency || 'EUR', currencies) : '—' }}</div></div>
                  <div><div class="pf-metric-label">Spent</div><div class="pf-metric-value">{{ (row.card.hasDuration && row.card.hasData) ? formatMoney(row.card.totalSpent, row.cfg.currency || 'EUR', currencies) : '—' }}</div></div>
                  <div><div class="pf-metric-label">Variance</div><div class="pf-metric-value" :style="{color: (row.card.hasDuration && row.card.hasData && row.card.hasPhasing) ? varColor(row.card.totalVar) : undefined}">{{ (row.card.hasDuration && row.card.hasData && row.card.hasPhasing) ? fmtVar(row.card.totalVar, row.cfg.currency || 'EUR') : '—' }}</div></div>
                </div>
                <div class="pf-card-divider"></div>
                <div class="pf-spent-bar" :class="'pf-spent-' + spentBarState(cardSpentPct(row.card))">
                  <div class="pf-spent-bar-fill" :style="{width: Math.min(100, cardSpentPct(row.card) || 0) + '%'}"></div>
                </div>
                <div class="pf-spent-label">{{ cardSpentLabel(cardSpentPct(row.card)) }}</div>
                <div class="pf-card-footer">
                  <span v-html="statusBadgeLarge(row.cfg.status)" class="pf-status-pill"></span>
                  <div class="pf-card-actions">
                    <button v-if="row.cfg.my_permission !== 'viewer'" class="btn btn-sm btn-outline-secondary" @click="goConfigure(row.cfg.id)">Configure</button>
                    <button class="btn btn-sm pf-btn-navy" @click="showDashboard(row.cfg.id)">Dashboard</button>
                  </div>
                </div>
              </div>
            </template>
          </div>
          <!-- Full-width children panel(s), placed after the entire row that contains the open program(s) (§13).
               One panel per qualifying program row in this chunk — plural because, while a filter is active,
               every program's children must stay visible (spec §10), not just the manually-expanded one. -->
          <template v-for="panelRow in chunk.filter(r => r.kind === 'program' && expandedProgramIds.has(r.id))" :key="'panel-' + panelRow.id">
            <div class="pf-children-panel">
              <div class="pf-children-panel-head">
                <div>
                  <div class="pf-children-panel-title">{{ panelRow.name }}</div>
                  <div class="pf-children-panel-sub">Program · {{ panelRow.children.length }} project{{ panelRow.children.length === 1 ? '' : 's' }}</div>
                </div>
                <div class="pf-children-panel-actions">
                  <button class="pf-clear-link" @click="goProgramDashboard(panelRow.id)">Program Dashboard →</button>
                  <!-- While a filter is active every program's children stay open by design,
                       so Close has nothing to close: hidden rather than left inert. -->
                  <button v-if="!portfolioFiltersActive" class="pf-clear-link" @click="toggleProgramExpanded(panelRow.id)">Close</button>
                </div>
              </div>
              <div class="pf-children-grid">
                <div v-for="cfg in panelRow.children" :key="cfg.id" class="pf-mini-card">
                  <div class="pf-mini-card-name">{{ cfg.name || cfg.id }}</div>
                  <div class="pf-mini-card-code" v-if="cfg.code">{{ cfg.code }}</div>
                  <span v-html="statusBadgeLarge(cfg.status)" class="pf-status-pill"></span>
                  <div class="pf-mini-card-amounts">{{ fmtK(cardDataMap[cfg.id].totalSpent, cfg.currency || 'EUR') }} / {{ fmtK(cardDataMap[cfg.id].totalPhasing, cfg.currency || 'EUR') }}</div>
                  <div class="pf-spent-bar pf-spent-thin" :class="'pf-spent-' + spentBarState(cardSpentPct(cardDataMap[cfg.id]))">
                    <div class="pf-spent-bar-fill" :style="{width: Math.min(100, cardSpentPct(cardDataMap[cfg.id]) || 0) + '%'}"></div>
                  </div>
                  <div class="pf-mini-card-footer">
                    <button v-if="cfg.my_permission !== 'viewer'" class="pf-clear-link" @click="goConfigure(cfg.id)">Configure</button>
                    <button class="pf-clear-link" @click="showDashboard(cfg.id)">Dashboard →</button>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </template>
      </div>

      <div v-else class="pf-list">
        <div class="pf-list-row pf-list-header">
          <div></div>
          <div>Program / Project</div>
          <div class="pf-list-stage">Stage</div>
          <div>Status</div>
          <div class="pf-list-duration">Duration</div>
          <div class="pf-list-sold">Sold</div>
          <div class="pf-list-spent">Spent</div>
          <div class="pf-list-variance">Variance</div>
          <div></div>
        </div>
        <template v-for="row in portfolioRows" :key="row.id">
          <!-- Program row -->
          <div v-if="row.kind === 'program'" class="pf-list-row pf-list-row-program">
            <button type="button" class="pf-list-chevron" :disabled="portfolioFiltersActive" @click="toggleListExpanded(row.id)">
              <ph-icon :name="(listExpandedPrograms.has(row.id) || portfolioFiltersActive) ? 'chevron-down' : 'chevron-right'" :size="14"></ph-icon>
            </button>
            <div class="pf-list-main">
              <div class="pf-list-name">{{ row.name }}</div>
              <div class="pf-list-sub">{{ row.clientName }}{{ row.clientName ? ' · ' : '' }}{{ row.children.length }} project{{ row.children.length === 1 ? '' : 's' }}</div>
            </div>
            <div class="pf-list-stage"><span class="pf-stage-pill" v-html="pipelineBadge(row.pipeline)"></span></div>
            <div class="pf-list-status pf-list-status-count">{{ row.atRisk > 0 ? row.atRisk + ' at risk' : row.children.length + ' project' + (row.children.length === 1 ? '' : 's') }}</div>
            <div class="pf-list-duration">{{ row.duration ? (monthLabel(row.duration.start) + ' – ' + monthLabel(row.duration.end)) : '—' }}</div>
            <div class="pf-list-sold">{{ row.stats?.grandEst == null ? '—' : formatMoney(row.stats.grandEst, row.stats.currency, currencies) }}</div>
            <div class="pf-list-spent">
              <div>{{ row.stats?.grandSpent == null ? '—' : formatMoney(row.stats.grandSpent, row.stats.currency, currencies) }}</div>
              <div v-if="row.stats && spentPercent(row.stats.grandSpent, row.stats.grandEst) !== null" class="pf-spent-bar pf-spent-thin" :class="'pf-spent-' + spentBarState(spentPercent(row.stats.grandSpent, row.stats.grandEst))">
                <div class="pf-spent-bar-fill" :style="{width: Math.min(100, spentPercent(row.stats.grandSpent, row.stats.grandEst)) + '%'}"></div>
              </div>
            </div>
            <div class="pf-list-variance" :style="{color: row.stats ? varColor(row.stats.grandVar) : undefined}">{{ row.stats == null ? '—' : fmtVar(row.stats.grandVar, row.stats.currency) }}</div>
            <div class="pf-list-actions">
              <button type="button" class="pf-clear-link" @click="openShareModal('program', row.id, row.name)">Share</button>
              <button type="button" class="pf-clear-link" @click="goProgramDashboard(row.id)">Dashboard →</button>
            </div>
          </div>
          <!-- Child rows -->
          <template v-if="row.kind === 'program' && (listExpandedPrograms.has(row.id) || portfolioFiltersActive)">
          <template v-for="cfg in row.children" :key="cfg.id">
            <div class="pf-list-row pf-list-row-child">
              <div></div>
              <div class="pf-list-main">
                <div class="pf-list-name">{{ cfg.name || cfg.id }}</div>
                <div class="pf-list-sub" v-if="cfg.code">{{ cfg.code }}</div>
              </div>
              <div class="pf-list-stage"></div>
              <div class="pf-list-status"><span class="pf-status-pill" v-html="statusBadgeLarge(cfg.status)"></span></div>
              <div class="pf-list-duration"></div>
              <div class="pf-list-sold">{{ (cardDataMap[cfg.id].hasDuration && cardDataMap[cfg.id].hasPhasing) ? formatMoney(cardDataMap[cfg.id].totalPhasing, cfg.currency || 'EUR', currencies) : '—' }}</div>
              <div class="pf-list-spent">
                <div>{{ (cardDataMap[cfg.id].hasDuration && cardDataMap[cfg.id].hasData) ? formatMoney(cardDataMap[cfg.id].totalSpent, cfg.currency || 'EUR', currencies) : '—' }}</div>
                <div v-if="cardSpentPct(cardDataMap[cfg.id]) !== null" class="pf-spent-bar pf-spent-thin" :class="'pf-spent-' + spentBarState(cardSpentPct(cardDataMap[cfg.id]))">
                  <div class="pf-spent-bar-fill" :style="{width: Math.min(100, cardSpentPct(cardDataMap[cfg.id])) + '%'}"></div>
                </div>
              </div>
              <div class="pf-list-variance" :style="{color: (cardDataMap[cfg.id].hasDuration && cardDataMap[cfg.id].hasData && cardDataMap[cfg.id].hasPhasing) ? varColor(cardDataMap[cfg.id].totalVar) : undefined}">{{ (cardDataMap[cfg.id].hasDuration && cardDataMap[cfg.id].hasData && cardDataMap[cfg.id].hasPhasing) ? fmtVar(cardDataMap[cfg.id].totalVar, cfg.currency || 'EUR') : '—' }}</div>
              <div class="pf-list-actions">
                <button type="button" class="pf-clear-link" @click="showDashboard(cfg.id)">Dashboard →</button>
              </div>
            </div>
          </template>
          </template>
          <!-- Ungrouped project row -->
          <div v-if="row.kind === 'project'" class="pf-list-row">
            <div></div>
            <div class="pf-list-main">
              <div class="pf-list-name">{{ fmtProjectTitle(row.cfg) }}</div>
              <div class="pf-list-sub">{{ row.clientName }}{{ row.clientName && row.cfg.code ? ' · ' : '' }}{{ row.cfg.code }}</div>
            </div>
            <div class="pf-list-stage"><span class="pf-stage-pill" v-html="pipelineBadge(getProjectPipeline(row.cfg.id) || row.cfg.pipeline)"></span></div>
            <div class="pf-list-status"><span class="pf-status-pill" v-html="statusBadgeLarge(row.cfg.status)"></span></div>
            <div class="pf-list-duration">{{ row.card.hasDuration ? (monthLabel(row.cfg.startDate) + ' – ' + monthLabel(row.cfg.endDate)) : '—' }}</div>
            <div class="pf-list-sold">{{ (row.card.hasDuration && row.card.hasPhasing) ? formatMoney(row.card.totalPhasing, row.cfg.currency || 'EUR', currencies) : '—' }}</div>
            <div class="pf-list-spent">
              <div>{{ (row.card.hasDuration && row.card.hasData) ? formatMoney(row.card.totalSpent, row.cfg.currency || 'EUR', currencies) : '—' }}</div>
              <div v-if="cardSpentPct(row.card) !== null" class="pf-spent-bar pf-spent-thin" :class="'pf-spent-' + spentBarState(cardSpentPct(row.card))">
                <div class="pf-spent-bar-fill" :style="{width: Math.min(100, cardSpentPct(row.card)) + '%'}"></div>
              </div>
            </div>
            <div class="pf-list-variance" :style="{color: (row.card.hasDuration && row.card.hasData && row.card.hasPhasing) ? varColor(row.card.totalVar) : undefined}">{{ (row.card.hasDuration && row.card.hasData && row.card.hasPhasing) ? fmtVar(row.card.totalVar, row.cfg.currency || 'EUR') : '—' }}</div>
            <div class="pf-list-actions">
              <button type="button" class="pf-clear-link" @click="showDashboard(row.cfg.id)">Dashboard →</button>
            </div>
          </div>
        </template>
      </div>
    </template>
  </template>

  <template v-else>
    <div class="ph">
      <div class="ph-main">
      <a href="#" class="ph-back" @click.prevent="showOverview"><ph-icon name="chevron-left" :size="12"></ph-icon>Portfolio</a>
          <div v-if="dashboardProgram" class="pr-program-row">

<script type="module">
  // DOM id for a Breakdown block key (task names carry spaces and punctuation): readable prefix plus a hash.
  function prBlockId(key) {
    let h = 5381;
    for (let i = 0; i < key.length; i++) h = ((h * 33) ^ key.charCodeAt(i)) >>> 0;
    return 'blk-' + key.replace(/[^a-zA-Z0-9_-]/g, '_').slice(0, 24) + '-' + h.toString(36);
  }

  // The shared Entries block of the Breakdown (spec 2026-11-03-breakdown-v2): months, Role/Resource filter
  // and column sort over the entries of one expanded row. The logic is pure (js/lib/report-entries.js);
  // `state` is the parent's entriesState[blockKey], so it survives collapsing and changing view.
  const PrEntries = {
    template: '#pr-entries-tpl',
    props: {
      entries: { type: Array, default: () => [] },
      rateFor: { type: Function, required: true },
      filterKind: { type: String, default: 'role' },
      state: { type: Object, required: true },
      periodLabel: { type: String, default: '' },
      currency: { type: String, default: '' },
      currencies: { type: Array, default: () => [] },
      isPhone: { type: Boolean, default: false },
      blockKey: { type: String, required: true },
      menuOpen: { type: Boolean, default: false },
    },
    emits: ['export', 'toggle-menu', 'open-sheet'],
    computed: {
      block() { return entriesBlock(this.entries, { ...this.state, filterKind: this.filterKind }, this.rateFor); },
      options() { return filterOptions(this.entries, this.filterKind); },
      chipLabel() { return filterChipLabel(this.state.filter, this.filterKind); },
      // "Role: " and the value after it, so the value can be bold (boards 7.4e, 7.4h).
      chipPrefix() { return this.chipLabel.slice(0, this.chipLabel.indexOf(' ') + 1); },
      chipValue() { return this.chipLabel.slice(this.chipLabel.indexOf(' ') + 1); },
      filterTitle() { return this.filterKind === 'resource' ? 'Filter by resource' : 'Filter by role'; },
      filterNote() { return (this.filterKind === 'resource' ? 'Resources' : 'Roles') + ' with entries in ' + this.periodLabel; },
      sortLabel() { return { date: 'Date', who: this.filterKind === 'resource' ? 'Resource' : 'Role', hours: 'Hours', amount: 'Amount' }[this.state.sort.key]; },
      whoLabel() { return this.filterKind === 'resource' ? 'Resource' : 'Role (resource)'; },
    },
    watch: {
      menuOpen(v) {
        if (!v || this.isPhone) return;
        this.$nextTick(() => { const i = this.$refs.menu && this.$refs.menu.querySelector('input'); if (i) i.focus(); });
      },
    },
    methods: {
      fmtH(v) { return window.fmtH(v); },
      fmtDate(d) { return window.fmtDate(d); },
      money(v) { return window.formatMoney(v, this.currency, this.currencies); },
      monthLabelLong(ym) {
        const k = String(ym).replace('-', '');
        return new Date(parseInt(k.slice(0, 4)), parseInt(k.slice(4, 6)) - 1, 1).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
      },
      monthId(m) { return prBlockId(this.blockKey) + '-' + m.ym; },
      whoText(e) {
        if (this.filterKind === 'resource') return e.owner || '—';
        return e.owner ? e.role + ' (' + e.owner + ')' : e.role;
      },
      ariaSort(key) {
        const s = this.state.sort;
        return s.key === key ? (s.dir === 'asc' ? 'ascending' : 'descending') : 'none';
      },
      sortBy(key) { this.state.sort = nextSort(this.state.sort, key); },
      // Without a filter one month is open at a time; with one, each month closes on its own.
      toggleMonth(m) {
        const s = this.state;
        if (s.filter.length) {
          s.closedMonths = s.closedMonths.includes(m.ym) ? s.closedMonths.filter(x => x !== m.ym) : [...s.closedMonths, m.ym];
        } else {
          s.openMonth = m.open ? '' : m.ym;
        }
      },
      setFilter(values) {
        const s = this.state;
        const hadFilter = s.filter.length > 0;
        s.filter = values;
        if (hadFilter !== values.length > 0) { s.closedMonths = []; s.openMonth = null; }
      },
      clearFilter() { this.setFilter([]); },
      onAll(ev) { this.clearFilter(); ev.target.checked = true; },
      toggleOption(v) {
        const f = this.state.filter;
        this.setFilter(f.includes(v) ? f.filter(x => x !== v) : [...f, v]);
      },
      onFilterClick(ev) {
        if (this.isPhone) this.$emit('open-sheet', 'filter');
        else this.$emit('toggle-menu', ev.currentTarget);
      },
      // Up/Down move between the checkboxes; Space (native) toggles; Esc is the page's.
      onMenuKey(ev) {

            const rate = cfgRes?.hourlyRate ?? findRate({ role, task: task.name }, cfg) ?? 0;

          const totRemainingEur = rows.reduce((s,r) => s+(r.remainingEur??0), 0);

          if (!r.date) return;
          const ym = `${r.date.getFullYear()}${String(r.date.getMonth()+1).padStart(2,'0')}`;
          monthSpend[ym] = (monthSpend[ym]||0) + r.hours * (findRate(r, cfg) ?? 0);
        });
        const hasData = data.length > 0;
        const hasPhasing = cfg.phasing && Object.keys(cfg.phasing).length > 0;
        const totalPtc = (cfg.ptc||[]).reduce((s,p) => s+(p.amount||0), 0);
        const totalSpent = months.reduce((s, ym) => s + (monthSpend[ym]||0), 0);
        const totalPhasing = months.reduce((s, ym) => s + (cfg.phasing?.[ym]||0), 0);
        const totalVar = totalPhasing - totalSpent;
        const totalHours = (cfg.tasks||[]).reduce((s,t) => s+(t.resources||[]).reduce((rs,r) => rs+(r.soldHours||0),0), 0);
        const totalBudget = (cfg.tasks||[]).reduce((s,t) => s+(t.resources||[]).reduce((rs,r) => rs+(r.soldHours||0)*(r.hourlyRate||0),0), 0);
        const cgRef = cfg.costGridRef;
        const apiBudget = (typeof getPipelineBudget === 'function' && cgRef?.versionId) ? getPipelineBudget(cgRef.versionId) : null;
        const displayFee = totalBudget > 0 ? totalBudget : (apiBudget?.fee || 0);
        const displayHours = totalHours > 0 ? totalHours : 0;
        const displayTotal = displayFee + totalPtc;
        const cur = cfg.currency || 'EUR';
        const budgetBadgeHtml = (displayFee > 0 || displayHours > 0)
          ? `<span class="portfolio-budget-badge">${displayHours > 0 ? displayHours.toLocaleString('en-US') + ' h &nbsp;/&nbsp; ' : ''}${displayTotal == null ? '—' : window.formatMoney(displayTotal, cur, window.__currencies)}${totalPtc > 0 ? `<span class="text-muted" style="font-size:.8em;font-weight:400"> &nbsp;(${displayFee == null ? '—' : window.formatMoney(displayFee, cur, window.__currencies)} fees + ${window.formatMoney(totalPtc, cur, window.__currencies)} PTC)</span>` : ''}${apiBudget && totalBudget === 0 ? '<span class="text-muted" style="font-size:.75em;margin-left:4px">(from cost grid)</span>' : ''}</span>`
          : '';
        return { hasData, hasPhasing, hasDuration, totalSpent, totalPhasing, totalVar, budgetBadgeHtml };
      },
      toggleSummary(id) {
        if (portfolioSummaryProjects.has(id)) portfolioSummaryProjects.delete(id); else portfolioSummaryProjects.add(id);
        saveSummarySelection();
        this.refreshTick++;
      },
      triggerLoadActuals(projectId) {
        window._loadActualsProjectId = projectId;
        document.getElementById('fileInput').click();
      },
      goPlanningForProject(id) {
        window.location.href = '/planning.html?projectId=' + encodeURIComponent(id);
      },
      goConfigure(id) {
        window.location.href = '/project-config.html?projectId=' + encodeURIComponent(id);
      },
      goProgramDashboard(id) {
        window.location.href = '/program.html?programId=' + encodeURIComponent(id);
      },
      clearPortfolioFilters() {
        this.portfolioSearch = '';
        this.portfolioClientFilter = [];
        this.portfolioStageFilter = [];
        this.portfolioStatusFilter = [];
      },
      setLayout(v) {
        this.portfolioLayout = v;
        try { localStorage.setItem('PDash_portfolioLayout', v); } catch (e) {}
      },
      // Review Focus 3: the Card grid isn't mounted while in List, and the initial
      // mount can happen before the project data has loaded (projects.length === 0),
      // so re-measuring is triggered again whenever the layout switches back to
      // Card or the data load bumps refreshTick — not just once at mounted().
      attachCardGridObserver() {
        if (this._cardGridObserver) { this._cardGridObserver.disconnect(); this._cardGridObserver = null; }
        if (this.portfolioLayout !== 'card') return;
        this.$nextTick(() => {
          const el = this.$refs.cardGrid;
          if (!el) return;
          this._cardGridObserver = new ResizeObserver(entries => {
            for (const entry of entries) this.gridColumns = columnsForWidth(entry.contentRect.width);
          });
          this._cardGridObserver.observe(el);
        });
      },
      cardSpentPct(card) {
        return spentPercent(card?.totalSpent ?? 0, card?.hasPhasing ? card.totalPhasing : 0);
      },
      cardSpentLabel(pct) {
        return pct === null ? 'No budget' : pct + '% spent';
      },
      fmtK(n, cur) {
        return `${currencyInfo(cur, this.currencies).symbol} ${Math.round((n || 0) / 1000)}k`;
      },
      esc,
      kpiLeftColor(left, total) {
        if (left === null) return '';
        if (left < 0) return 'var(--color-danger)';
        if (total && left < total * 0.1) return 'var(--kpi-orange)';
        return 'var(--color-success)';
      },
      showDashboard(pid) {
        this.view = 'dashboard';
        this.dashboardProjectId = pid;
        this.dashboardReady = true;
        this.reportToday = new Date();
        selectedProjectId = pid;
        history.replaceState(null, '', '/portfolio.html?projectId=' + encodeURIComponent(pid));
        const cfg = this.dashboardProject;
        if (typeof updateBreadcrumbs === 'function') updateBreadcrumbs([
          { label: 'Home', href: '/pipeline.html' },
          { label: 'Portfolio', href: '/portfolio.html' },
          { label: cfg?.name || pid },
        ]);
        this.burndownInterval = 'monthly';
        this.burndownTaskFilter = '';
        this.progressView = 'burndown';
        this.breakdownView = 'task';
        this.resetDateFilter();
        this.entriesState = {};
        this.closeMenu(false);
        this.hideSheet();
        this.switchMenuOpen = false;
        this.loadDashboardTags(pid);
        this.$nextTick(() => this.renderBurndownChart());
      },
      async loadDashboardTags(pid) {
        this.dashboardTags = [];
        try {
          const tags = await Api.projects.tags.list(pid);
          if (this.dashboardProjectId === pid) this.dashboardTags = tags || [];
        } catch (e) {
          if (this.dashboardProjectId === pid) this.dashboardTags = [];
        }
      },
      // Chart.js cannot resolve var(); read the token's computed value instead.
      chartColor(name, fallback) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
      },
      renderBurndownChart() {
        if (this._burndownChart) { this._burndownChart.destroy(); this._burndownChart = null; }
        const series = this.burndownSeries;
        if (!series || !this.$refs.burndownCanvas) return;

        const currencyForChart = this.dashCurrency;
        const { labels, burnValues, idealValues, budget, totalBudgetEur, tooltipBudgetConsumed, tooltipPhasingEur, hasPhasingEur, todayValue } = series;
        const index = this.burndownTodayIndex;

        const datasets = [{
          label: budget !== null ? 'Remaining hours (actual)' : 'Cumulative hours',
          data: burnValues,
          borderColor: this.chartColor('--chart-actual', 'gray'), backgroundColor: 'rgba(13,110,253,0.07)',
          fill: true, tension: 0.2, pointHoverRadius: 4,
          pointRadius: labels.map((_, i) => i === index ? 5 : 0),
          pointBackgroundColor: this.chartColor('--brand-navy', 'navy'),
        }];
        if (idealValues) {
          datasets.push({
            label: 'Remaining hours planned',
            data: idealValues,
            borderColor: this.chartColor('--chart-phasing', 'gray'), borderDash: [6, 4], borderWidth: 2,
            fill: false, pointRadius: 0, tension: 0,
          });
        }
        const todayPlugin = window.todayLabelPlugin({
          id: 'prTodayLabel',
          index,
          text: index !== null ? `${fmtH(todayValue)} ${budget !== null ? 'left' : 'consumed'}` : '',
          bg: this.chartColor('--brand-navy', 'navy'),
          fg: this.chartColor('--surface-white', 'white'),
        });

        this._burndownChart = new Chart(this.$refs.burndownCanvas, {
          type: 'line',
          data: { labels, datasets },
          plugins: [todayPlugin],
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              tooltip: {
                mode: 'index', intersect: false,
                // After today the actual line has no value: show the planned line's point instead.
                filter: item => item.datasetIndex === (burnValues[item.dataIndex] == null ? 1 : 0),
                displayColors: false,
                callbacks: {
                  label: context => {
                    const i = context.dataIndex;
                    const future = burnValues[i] == null;
                    const lines = ['── Hours ──────────────────'];
                    if (!future && budget !== null) {
                      lines.push(`  Consumed:   ${fmtH(Math.max(0, budget - burnValues[i]))}`);
                      lines.push(`  Remaining:  ${fmtH(Math.max(0, burnValues[i]))}`);
                    } else if (!future) {
                      lines.push(`  Consumed:   ${fmtH(burnValues[i])}`);
                    }
                    if (idealValues) lines.push(`  Planned:    ${fmtH(idealValues[i])}`);
                    const budgetLines = [];
                    if (tooltipBudgetConsumed && !future) {
                      const consumed = tooltipBudgetConsumed[i] ?? 0;
                      budgetLines.push(`  Consumed:   ${window.formatMoney(consumed, currencyForChart, window.__currencies)}`);
                      budgetLines.push(`  Remaining:  ${window.formatMoney(totalBudgetEur - consumed, currencyForChart, window.__currencies)}`);
                    }
                    if (tooltipBudgetConsumed && hasPhasingEur && tooltipPhasingEur?.[i] != null) budgetLines.push(`  Planned:    ${window.formatMoney(tooltipPhasingEur[i], currencyForChart, window.__currencies)}`);
                    if (budgetLines.length) lines.push('', '── Budget ─────────────────', ...budgetLines);
                    return lines;
                  },
                },
              },
              legend: { display: false },
            },
            scales: {
              x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true } },
              y: { beginAtZero: true },
            },
          },
        });
      },
      monthState(ym, today) { return monthState(ym, today); },
      // Built from monthlySummary, not from the rendered table (B-075): numbers stay numbers, the
      // "current" pill and the future months' "—" are not exported.
      exportMonthlyXls() {
        const ms = this.monthlySummary;
        if (!ms) return;
        const cur = this.dashCurrency, hasCfg = !!this.dashboardProject;
        const digits = currencyInfo(cur, this.currencies).digits;
        const h = v => (v == null ? '' : Math.round(v * 100) / 100);
        const money = v => (v == null ? '' : Number(v.toFixed(digits)));
        const head = ['Month', 'Planned hours (resource plan)', 'Consumed h', 'Hours variance', `Est. budget (${cur})`, `Spent (${cur})`, `Budget variance (${cur})`];
        if (ms.hasPtc) head.push(`PTC (${cur})`);
        const aoa = [head];
        ms.months.forEach(m => {
          const future = monthState(m.ym, this.reportToday) === 'future';
          const line = [m.label, hasCfg ? h(m.estimatedHours) : '', future ? '' : h(m.hours), future ? '' : h(m.hVar),
            hasCfg ? money(m.estimated) : '', future ? '' : money(m.spent), future ? '' : money(m.bVar)];
          if (ms.hasPtc) line.push(m.ptc > 0 ? money(m.ptc) : '');
          aoa.push(line);
        });
        const total = ['Total', h(ms.totEstimatedHours), h(ms.totHours), h(ms.totHoursVariance), money(ms.totEstimated), money(ms.totSpent), money(ms.totBudgetVariance)];
        if (ms.hasPtc) total.push(money(ms.totPtc));
        aoa.push(total);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'Data');
        XLSX.writeFile(wb, 'monthly_summary.xlsx');
      },
      exportChartPng() {
        if (!this._burndownChart) return;
        const a = document.createElement('a');
        a.href = this._burndownChart.toBase64Image('image/png', 1);
        a.download = `burndown_${this.dashboardProjectId || 'chart'}.png`;
        a.click();
      },
    },
    watch: {
      burndownInterval() { this.renderBurndownChart(); },
      burndownTaskFilter() { this.renderBurndownChart(); },
      progressView(v) {
        if (v === 'burndown') this.$nextTick(() => this.renderBurndownChart());
        else if (this._burndownChart) { this._burndownChart.destroy(); this._burndownChart = null; }
      },
      portfolioLayout(v) {
        // Card and List keep their own expansion state (one open vs. many); this carries
        // it across when the layout switches, so a program opened in one view is still
        // open in the other. See syncExpansionOnLayoutChange for the asymmetric mapping.
        const next = syncExpansionOnLayoutChange(v, this.expandedProgramId, [...this.listExpandedPrograms]);
        this.expandedProgramId = next.expandedProgramId;
        this.listExpandedPrograms = new Set(next.listExpandedIds);
        this.attachCardGridObserver();
      },
      refreshTick() { this.attachCardGridObserver(); this.pruneEntryFilters(); },
      filterRange() { this.pruneEntryFilters(); },
      breakdownView() { if (this.openMenu && this.openMenu.startsWith('filter:')) this.closeMenu(false); },
      // The grid container only exists while view === 'overview' (showDashboard swaps the whole
      // template out); without this, returning from the dashboard (or landing on it first via
      // ?projectId= and then going "back to portfolio") leaves gridColumns stuck at its last value.
      view() { this.attachCardGridObserver(); },
    },
  }).component('ph-icon', window.PhIcon).component('cg-date-picker', window.CgDatePicker).component('pr-entries', PrEntries).mount('#app');
</script>
</body>
