<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/sidebar-state.js?v=1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDash — Terms & Conditions</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B1840'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Segoe UI,Arial,sans-serif' font-size='42' font-weight='700' fill='%23F0287A'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="css/tokens.css?v=14">
  <link rel="stylesheet" href="css/style.css?v=38">
  <style>
    .page { margin: var(--content-gap) auto; }
    .card { border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  </style>
</head>
<body>

<!-- Navbar (injected by nav.js) -->
<div id="app-shell">
<div id="nav-container"></div>
<div id="app-main">

<div id="app" v-cloak>

  <template v-if="ready || accessDenied">
  <div class="ph">
    <div class="ph-main">
      <div class="ph-title-row"><h1 class="ph-title">Terms &amp; Conditions</h1></div>
    </div>
  </div>

  <div class="page app-container">
    <div v-if="accessDenied" class="alert alert-danger">Access denied — sysadmin only.</div>

    <template v-else>
      <!-- ── TERMS & CONDITIONS ───────────────────────────────── -->
      <div class="card">
        <div class="card-body p-4">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <div>
              <h5 class="fw-bold mb-0">📄 Terms &amp; Conditions</h5>
              <div class="text-muted mt-1" style="font-size:.82rem">
                Current version: <strong>v{{ terms.version }}</strong>
                <span v-if="terms.updatedAt"> · Last updated {{ fmtDate(terms.updatedAt) }}</span>
                <span v-if="terms.updatedBy"> by {{ terms.updatedBy }}</span>
              </div>
            </div>
            <div class="d-flex gap-2">
              <a href="/terms.html" target="_blank" class="btn btn-outline-secondary btn-sm">👁 Preview</a>
              <button class="btn btn-primary btn-sm" style="background:var(--brand-navy);border-color:var(--brand-navy)"
                      @click="saveTerms(false)" :disabled="terms.saving">Save draft</button>
              <button class="btn btn-warning btn-sm" @click="saveTerms(true)" :disabled="terms.saving">
                🚀 Publish new version
              </button>
            </div>
          </div>
          <div v-if="terms.msg" class="alert alert-sm mb-3" :class="terms.msgOk ? 'alert-success' : 'alert-danger'" style="font-size:.85rem">{{ terms.msg }}</div>
          <div class="text-muted mb-2" style="font-size:.78rem">Edit HTML content below. "Save draft" saves without bumping the version. "Publish new version" increments the version — all users will be asked to re-accept at next login.</div>
          <textarea v-model="terms.content" class="form-control font-monospace" rows="18" style="font-size:.78rem;resize:vertical"></textarea>
        </div>
      </div>

      <!-- ── VERSION HISTORY ───────────────────────────────── -->
      <div class="card mt-4">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-3">📜 Version History</h5>
          <div v-if="versionsError" class="alert alert-danger alert-sm mb-3" style="font-size:.85rem">{{ versionsError }}</div>
          <div v-if="versionsLoading" class="text-muted" style="font-size:.85rem">Loading…</div>
          <table v-else class="table table-sm align-middle mb-0" style="font-size:.85rem">
            <thead>
              <tr><th>Version</th><th>Published</th><th>By</th><th></th></tr>
            </thead>
            <tbody>
              <tr v-for="v in versions" :key="v.version">
                <td>v{{ v.version }}</td>
                <td>{{ fmtDate(v.publishedAt) }}</td>
                <td>{{ v.publishedBy || '—' }}</td>
                <td class="text-end"><button class="btn btn-outline-secondary btn-sm" @click="viewVersion(v.version)">👁 View</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </template>
  </div>
  </template>

  <div v-else class="d-flex align-items-center justify-content-center" style="height:60vh">
    <div class="spinner-border text-secondary"></div>
  </div>

  <!-- ── VERSION VIEW MODAL ───────────────────────────────── -->
  <div class="modal fade" id="versionViewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title fw-bold" v-if="viewingVersion">v{{ viewingVersion.version }} — published {{ fmtDate(viewingVersion.publishedAt) }} by {{ viewingVersion.publishedBy || '—' }}</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div v-if="viewVersionError" class="alert alert-danger alert-sm mb-3" style="font-size:.85rem">{{ viewVersionError }}</div>
          <textarea v-if="viewingVersion" class="form-control font-monospace" rows="18" style="font-size:.78rem" readonly :value="viewingVersion.content"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

</div>

</div><!-- /#app-main -->
</div><!-- /#app-shell -->

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/vue@3.5.45/dist/vue.global.prod.js" integrity="sha384-K2FjvpG1y48yCE+7CBPhnKc16ShPmT3dlNwvoA3dhjV18+L5ugI0P8PWPvdjm/Fa" crossorigin="anonymous"></script>
<script defer src="js/api.js?v=15"></script>
<script defer src="js/core.js?v=16"></script>
<script type="module" src="js/lib/notif-browser.js?v=2"></script>
<script type="module" src="js/lib/notification-url.js?v=1"></script>
<script defer src="js/notifications.js?v=5"></script>
<script type="module" src="js/lib/icons.js?v=7"></script>
<script defer src="js/nav.js?v=24"></script>
<script type="module" src="js/pages/_terms-editor.js?v=1"></script>
</body>
</html>
