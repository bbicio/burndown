<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/sidebar-state.js?v=1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDash — DB Reset</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B1840'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Segoe UI,Arial,sans-serif' font-size='42' font-weight='700' fill='%23F0287A'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="css/tokens.css?v=14">
  <link rel="stylesheet" href="css/style.css?v=38">
  <style>
    .page { margin: var(--content-gap) auto; }
    #resetCards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }
    @media (max-width: 1400px) { #resetCards { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 700px)  { #resetCards { grid-template-columns: 1fr; } }
    #singleActions { display: grid; gap: 1rem; max-width: 560px; }
    .danger-card {
      border: var(--card-danger-border);
      border-radius: var(--card-radius);
      background: var(--card-bg);
      padding: var(--card-pad);
      display: flex;
      flex-direction: column;
    }
    .danger-card h5 { color: var(--color-danger-text); font-weight: 700; margin-bottom: .25rem; }
    .danger-card p  { color: var(--text-muted); font-size: .875rem; margin-bottom: .75rem; flex: 1; }
    .action-card {
      border: var(--card-border);
      border-radius: var(--card-radius);
      background: var(--card-bg);
      padding: var(--card-pad);
      display: flex;
      flex-direction: column;
    }
    .action-card h5 { color: var(--brand-navy); font-weight: 700; margin-bottom: .25rem; }
    .action-card p  { color: var(--text-muted); font-size: .875rem; margin-bottom: .75rem; flex: 1; }
    .spinner-border { width: 1rem; height: 1rem; border-width: 2px; }
  </style>
</head>
<body>

<!-- Navbar (injected by nav.js) -->
<div id="app-shell">
<div id="nav-container"></div>
<div id="app-main">

<div id="app" v-cloak>

  <template v-if="ready || accessDenied">
  <div class="ph">
    <div class="ph-main">
      <div class="ph-title-row"><h1 class="ph-title">Database Reset</h1></div>
    </div>
  </div>

  <div class="page app-container">
    <div class="alert alert-danger alert-sm mb-4">Sysadmin-only. Each action is irreversible. Data deleted here cannot be recovered.</div>

    <div v-if="accessDenied" class="alert alert-danger alert-sm">Access denied — sysadmin only.</div>

    <template v-else>
      <div id="resetCards">
        <div v-if="scopeErrorMsg" class="alert alert-danger py-2 mb-3" style="grid-column:1 / -1">{{ scopeErrorMsg }}</div>
        <div class="danger-card" v-for="s in scopes" :key="s.scope">
          <h5>{{ s.title }}</h5>
          <p>{{ s.description }}</p>
          <button class="btn btn-sm"
                  :class="scopeDoneFlag && scopeDoneFlag.scope === s.scope ? 'btn-success' : 'btn-danger'"
                  :disabled="scopeDoneFlag && scopeDoneFlag.scope === s.scope"
                  @click="openScopeConfirm(s.scope)">
            {{ scopeDoneFlag && scopeDoneFlag.scope === s.scope ? '✓ Done' : s.buttonText }}
          </button>
        </div>
      </div>

      <hr class="my-4">

      <div id="singleActions">
        <div class="danger-card">
          <h5>Delete single proposal + linked projects</h5>
          <p>Deletes one cost grid by UUID and all projects linked to any of its versions. Also removes resource shares for the cost grid and linked projects.</p>
          <div class="d-flex gap-2 align-items-center">
            <input type="text" v-model="cgIdInput" class="form-control form-control-sm font-monospace"
                   placeholder="Cost grid UUID" autocomplete="off" style="flex:1">
            <button class="btn btn-danger btn-sm" style="white-space:nowrap" @click="openCgDeleteConfirm">Delete proposal</button>
          </div>
          <div v-if="cgDeleteMsg" class="mt-2 small" :class="cgDeleteMsg.isError ? 'text-danger' : 'text-success'">{{ cgDeleteMsg.text }}</div>
        </div>

        <div class="action-card">
          <h5>Change proposal owner</h5>
          <p>Reassigns a proposal (cost grid) to a different active user.</p>
          <div class="d-flex flex-column gap-2">
            <input type="text" v-model="cgOwnerIdInput" class="form-control form-control-sm font-monospace"
                   placeholder="Cost grid UUID" autocomplete="off">
            <select v-model="ownerSelected" class="form-select form-select-sm">
              <option value="">{{ !ownerOptionsLoaded ? 'Loading users…' : (ownerLoadFailed ? 'Failed to load users' : 'Select new owner…') }}</option>
              <option v-for="u in ownerOptions" :key="u.id" :value="u.id">{{ u.label }}</option>
            </select>
            <button class="btn btn-primary btn-sm" style="white-space:nowrap" :disabled="ownerChangeBusy" @click="changeOwner">Change owner</button>
          </div>
          <div v-if="cgOwnerMsg" class="mt-2 small" :class="cgOwnerMsg.isError ? 'text-danger' : 'text-success'">{{ cgOwnerMsg.text }}</div>
        </div>
      </div>
    </template>
  </div>
  </template>

  <div v-else class="d-flex align-items-center justify-content-center" style="height:60vh">
    <div class="spinner-border text-secondary"></div>
  </div>

  <!-- Confirm modal -->
  <div class="modal fade" id="confirmModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered" style="max-width:440px">
      <div class="modal-content border-danger">
        <div class="modal-header border-0 pb-1">
          <h6 class="modal-title fw-bold text-danger">⚠️ Confirm deletion</h6>
        </div>
        <div class="modal-body">
          <p class="mb-2">{{ confirmText }}</p>
          <p class="text-danger fw-semibold mb-3" style="font-size:.875rem">This action is permanent and cannot be undone.</p>
          <label class="form-label small fw-semibold">Type <strong>DELETE</strong> to confirm</label>
          <input type="text" class="form-control form-control-sm" v-model="confirmInputValue" placeholder="DELETE" autocomplete="off">
        </div>
        <div class="modal-footer border-0 pt-0">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger btn-sm" :disabled="confirmInputValue.trim() !== 'DELETE' || confirmBusy" @click="confirmDelete">
            <span v-if="confirmBusy" class="spinner-border me-1"></span>
            Delete permanently
          </button>
        </div>
      </div>
    </div>
  </div>

</div>

</div><!-- /#app-main -->
</div><!-- /#app-shell -->

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/vue@3.5.45/dist/vue.global.prod.js" integrity="sha384-K2FjvpG1y48yCE+7CBPhnKc16ShPmT3dlNwvoA3dhjV18+L5ugI0P8PWPvdjm/Fa" crossorigin="anonymous"></script>
<script defer src="js/api.js?v=18"></script>
<script defer src="js/core.js?v=17"></script>
<script type="module" src="js/lib/notif-browser.js?v=2"></script>
<script type="module" src="js/lib/notification-url.js?v=1"></script>
<script defer src="js/notifications.js?v=6"></script>
<script type="module" src="js/lib/icons.js?v=7"></script>
<script defer src="js/nav.js?v=24"></script>
<script type="module" src="js/pages/_db-reset.js?v=1"></script>
</body>
</html>
