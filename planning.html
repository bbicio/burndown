<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/sidebar-state.js?v=1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDash — Planning</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B1840'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Segoe UI,Arial,sans-serif' font-size='42' font-weight='700' fill='%23F0287A'%3EP%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="css/tokens.css?v=14">
  <link rel="stylesheet" href="css/style.css?v=38">
  <link rel="stylesheet" href="css/controls.css?v=1">
  <link rel="stylesheet" href="css/planning.css?v=2">
</head>
<body class="pp-fullwidth">

<!-- Navbar -->
<div id="app-shell">
<div id="nav-container"></div>
<div id="app-main">

<div id="planningApp" v-cloak>

<!-- Hidden file input for XLS upload -->
<input type="file" id="fileInput" ref="fileInput" accept=".xlsx" style="display:none" @change="onFileInputChange">
<span id="fileStatus" style="display:none;font-size:var(--text-xs);margin-right:8px"></span>


<div>

  <!-- Planning section (main content on this page) -->
  <div id="portfolioPlanningSection" class="app-container">
    <div v-if="loading" class="d-flex justify-content-center align-items-center" style="height:60vh">
      <div class="spinner-border text-secondary"></div>
    </div>
    <div v-else-if="loadError" class="alert alert-danger alert-sm m-4">{{ loadError }}</div>
    <template v-else>
    <div class="ph">
      <div class="ph-main">
        <div class="ph-title-row">
          <h1 class="ph-title">{{ planningTitle }}</h1>
        </div>
        <div class="ph-sub">{{ planningSubtitle }}</div>
      </div>
      <div class="ph-side"><div class="ph-actions">
        <button v-if="isAdminUser" type="button" class="ph-btn" ref="taOpenBtn" title="Find the best people to allocate to a project" aria-label="Team assistant" @click="taOpen = !taOpen"><ph-icon name="team" :size="14"></ph-icon><span class="pl-btn-text">Team assistant</span></button>
        <button type="button" class="ph-btn pl-load-btn" @click="$refs.fileInput.click()"><ph-icon name="upload" :size="14"></ph-icon><span class="pl-btn-text">Load XLSX</span></button>
        <button type="button" class="ph-btn" aria-label="Export XLS" :disabled="modelPending || !!modelError" @click="exportCurrentView"><ph-icon name="download" :size="14"></ph-icon><span class="pl-btn-text">Export XLS</span></button>
        <button v-if="isPhone" type="button" class="ph-btn pl-head-filters" data-bs-toggle="offcanvas" data-bs-target="#plFiltersPanel" aria-controls="plFiltersPanel"><ph-icon name="filter" :size="14"></ph-icon><span class="pl-btn-text">Filters</span><span v-if="activeFilterCount" class="pl-count">{{ activeFilterCount }}</span></button>
      </div></div>
    </div>
    <div class="ph-toolbar pl-toolbar">
      <!-- Row 1: view, interval, period, search -->
      <div class="pl-toolbar-row">
        <div class="pl-seg" role="group" aria-label="View">
          <button type="button" class="pl-seg-btn" :class="{ active: view === 'byrole' }" :aria-pressed="view === 'byrole' ? 'true' : 'false'" @click="view = 'byrole'">By role</button>
          <button type="button" class="pl-seg-btn" :class="{ active: view === 'byproject' }" :aria-pressed="view === 'byproject' ? 'true' : 'false'" @click="view = 'byproject'">By project</button>
          <button type="button" class="pl-seg-btn" :class="{ active: view === 'byowner' }" :aria-pressed="view === 'byowner' ? 'true' : 'false'" @click="view = 'byowner'">By owner</button>
        </div>
        <div v-if="!isPhone" class="pl-seg" role="group" aria-label="Interval">
          <button type="button" class="pl-seg-btn" :class="{ active: interval === 'monthly' }" :aria-pressed="interval === 'monthly' ? 'true' : 'false'" @click="interval = 'monthly'">Monthly</button>
          <button type="button" class="pl-seg-btn" :class="{ active: interval === 'weekly' }" :aria-pressed="interval === 'weekly' ? 'true' : 'false'" @click="interval = 'weekly'">Weekly</button>
        </div>
        <div v-if="!isPhone" class="pl-period" ref="periodBox">
          <div class="pl-period-ctl">
            <button type="button" class="pl-period-arrow" title="Previous month" aria-label="Previous month" :disabled="atLeftLimit" @click="shiftPeriod(-1)"><ph-icon name="chevron-left" :size="14"></ph-icon></button>
            <button type="button" class="pl-period-label" ref="periodLabelBtn" aria-haspopup="dialog" :aria-expanded="periodMenuOpen ? 'true' : 'false'" @click="periodMenuOpen = !periodMenuOpen">{{ periodLabel }} <ph-icon name="chevron-down" :size="14"></ph-icon></button>
            <button type="button" class="pl-period-arrow" title="Next month" aria-label="Next month" :disabled="atRightLimit" @click="shiftPeriod(1)"><ph-icon name="chevron-right" :size="14"></ph-icon></button>
          </div>
          <div v-if="periodMenuOpen" class="pl-popover pl-period-menu" role="dialog" aria-label="Period">
            <div class="pl-period-presets">
              <button type="button" class="pl-filter-btn" @click="applyPreset(3)">3 months</button>
              <button type="button" class="pl-filter-btn" @click="applyPreset(6)">6 months</button>
              <button type="button" class="pl-filter-btn" @click="applyPreset(12)">12 months</button>
              <button type="button" class="pl-filter-btn" @click="applyWholeRange">Whole range</button>
            </div>
            <div class="pl-period-range">
              <div class="pl-period-field"><span class="pl-toolbar-label">From</span>
                <cg-date-picker mode="month" inline-popover :model-value="fromYm" :min="axisMinYm" :max="toYm" aria-label="From month" @update:model-value="setFrom($event)"></cg-date-picker></div>
              <div class="pl-period-field"><span class="pl-toolbar-label">To</span>
                <cg-date-picker mode="month" inline-popover :model-value="toYm" :min="fromYm" :max="axisMaxYm" aria-label="To month" @update:model-value="setTo($event)"></cg-date-picker></div>
            </div>
            <button v-if="isTablet" type="button" class="pl-link" :disabled="isDefaultWindow" @click="goToday">Today</button>
          </div>
        </div>
        <button v-if="!isTablet" type="button" class="pl-link pl-today" :disabled="isDefaultWindow" @click="goToday">Today</button>
        <div class="ph-toolbar-spacer"></div>
        <!-- At 1024px and below the search, filters, switches and Load XLS move into the Filters panel (#plFiltersPanel). -->
        <!-- Always mounted (never v-if), so its content is the first thing in #plFiltersBody. -->
        <teleport to="#plFiltersBody">
          <div class="pl-filters-head">
            <h2 class="pl-filters-title" id="plFiltersTitle">Filters</h2>
            <button v-if="!isPhone" type="button" class="btn btn-ghost btn-icon" data-bs-dismiss="offcanvas" aria-label="Close filters"><ph-icon name="close"></ph-icon></button>
            <button v-else type="button" class="btn btn-ghost pl-sheet-close" data-bs-dismiss="offcanvas" aria-label="Close filters">Close</button>
          </div>
        </teleport>
        <teleport to="#plFiltersBody" :disabled="!isTablet">
          <div class="pl-search">
            <ph-icon name="search" :size="14"></ph-icon>
            <input type="search" class="form-control form-control-sm" :aria-label="searchPlaceholder" :placeholder="searchPlaceholder" v-model="search[view]">
          </div>
        </teleport>
        <!-- Smartphone only: the sheet carries the interval and the period the toolbar no longer shows. Their order in the sheet comes from CSS order, not from mount order. -->
        <teleport to="#plFiltersBody" v-if="isPhone">
          <div class="pl-sheet-section pl-sheet-interval">
            <span class="pl-toolbar-label">Interval</span>
            <div class="pl-seg" role="group" aria-label="Interval">
              <button type="button" class="pl-seg-btn" :class="{ active: interval === 'monthly' }" :aria-pressed="interval === 'monthly' ? 'true' : 'false'" @click="interval = 'monthly'">Monthly</button>
              <button type="button" class="pl-seg-btn" :class="{ active: interval === 'weekly' }" :aria-pressed="interval === 'weekly' ? 'true' : 'false'" @click="interval = 'weekly'">Weekly</button>
            </div>
          </div>
          <div class="pl-sheet-section pl-sheet-period">
            <span class="pl-toolbar-label">Period</span>
            <div class="pl-period-presets">
              <button type="button" class="pl-filter-btn" @click="applyPreset(3)">3 months</button>
              <button type="button" class="pl-filter-btn" @click="applyPreset(6)">6 months</button>
              <button type="button" class="pl-filter-btn" @click="applyPreset(12)">12 months</button>
              <button type="button" class="pl-filter-btn" @click="applyWholeRange">Whole range</button>
            </div>
            <div class="pl-period-range">
              <div class="pl-period-field"><span class="pl-toolbar-label">From</span>
                <cg-date-picker mode="month" inline-popover :model-value="fromYm" :min="axisMinYm" :max="toYm" aria-label="From month" @update:model-value="setFrom($event)"></cg-date-picker></div>
              <div class="pl-period-field"><span class="pl-toolbar-label">To</span>
                <cg-date-picker mode="month" inline-popover :model-value="toYm" :min="fromYm" :max="axisMaxYm" aria-label="To month" @update:model-value="setTo($event)"></cg-date-picker></div>
            </div>
            <button type="button" class="pl-link" :disabled="isDefaultWindow" @click="goToday">Today</button>
          </div>
        </teleport>
        <button v-if="isTablet && !isPhone" type="button" class="pl-filter-btn" data-bs-toggle="offcanvas" data-bs-target="#plFiltersPanel" aria-controls="plFiltersPanel">
          <ph-icon name="filter" :size="14"></ph-icon> Filters <span v-if="activeFilterCount" class="pl-count">{{ activeFilterCount }}</span>
        </button>
      </div>
      <!-- Row 2: filters and display switches -->
      <div class="pl-toolbar-row pl-toolbar-row--filters" v-show="!isTablet">
       <teleport to="#plFiltersBody" :disabled="!isTablet">
        <span class="pl-toolbar-label">Pipeline</span>
        <button v-for="p in allPipelines" :key="p" type="button" class="pl-stage-chip" :class="['pl-stage-chip--' + p.toLowerCase(), { 'is-active': isPipelineActive(p) }]"
                :aria-pressed="isPipelineActive(p) ? 'true' : 'false'" @click="togglePipelineFilter(p)"><span class="pl-stage-dot" aria-hidden="true"></span>{{ p }}</button>
        <span class="pl-sep" aria-hidden="true"></span>
        <div class="dropdown">
          <button type="button" class="pl-filter-btn dropdown-toggle" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
            Projects: <strong>{{ projectFilters.size ? projectFilters.size : 'All (' + eligibleProjects.length + ')' }}</strong>
          </button>
          <div class="dropdown-menu pl-pop">
            <div class="pl-search pl-pop-search">
              <ph-icon name="search" :size="14"></ph-icon>
              <input type="search" class="form-control form-control-sm" placeholder="Search project or client…" aria-label="Search project or client" v-model="projectQuery">
            </div>
            <div class="pl-pop-list">
              <label v-for="p in projectOptions" :key="p.id" class="pl-pop-row">
                <input type="checkbox" class="form-check-input" :checked="isProjectChecked(p.id)" @change="onProjectFilterToggle(p.id)">
                <span class="pl-pop-text">
                  <span class="pl-pop-name" :title="p.name || p.id">{{ p.name || p.id }}</span>
                  <span v-if="projectClient(p)" class="pl-pop-sub">{{ projectClient(p) }}</span>
                </span>
                <span v-if="p.pipeline" v-html="stagePill(p.pipeline)"></span>
              </label>
              <div v-if="!projectOptions.length" class="pl-pop-empty">No projects match.</div>
            </div>
            <div class="pl-pop-foot">
              <span>{{ projectFilters.size || eligibleProjects.length }} of {{ eligibleProjects.length }} selected</span>
              <span class="pl-pop-foot-actions">
                <button type="button" class="pl-link" @click="selectAllProjects">Select all</button>
                <button type="button" class="pl-link" @click="resetProjectFilters">Clear</button>
              </span>
            </div>
          </div>
        </div>
        <div class="dropdown">
          <button type="button" class="pl-filter-btn dropdown-toggle" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
            Team: <strong>{{ teamFilters.size ? teamFilters.size : 'All' }}</strong>
          </button>
          <div class="dropdown-menu pl-pop pl-pop--narrow">
            <div class="pl-pop-list">
              <label v-for="t in allTeams" :key="t" class="pl-pop-row">
                <input type="checkbox" class="form-check-input" :checked="isTeamChecked(t)" @change="onTeamFilterToggle(t)">
                <span class="pl-pop-text"><span class="pl-pop-name">{{ t }}</span></span>
              </label>
              <div v-if="!allTeams.length" class="pl-pop-empty">No teams.</div>
            </div>
            <div class="pl-pop-foot">
              <span>{{ teamFilters.size || allTeams.length }} of {{ allTeams.length }} selected</span>
              <span class="pl-pop-foot-actions">
                <button type="button" class="pl-link" @click="selectAllTeams">Select all</button>
                <button type="button" class="pl-link" @click="resetTeamFilters">Clear</button>
              </span>
            </div>
          </div>
        </div>
        <div class="ph-toolbar-spacer"></div>
        <div class="form-check form-switch mb-0 pl-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="chkMonthlyPulse" v-model="monthlyPulse">
          <label class="form-check-label" for="chkMonthlyPulse">Monthly pulse</label>
        </div>
        <div class="form-check form-switch mb-0 pl-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="chkRoundHours" v-model="roundHours">
          <label class="form-check-label" for="chkRoundHours">Rounded</label>
        </div>
        <button v-if="isTablet && !isPhone" type="button" class="ph-btn pl-filters-load" @click="$refs.fileInput.click()"><ph-icon name="upload" :size="14"></ph-icon> Load XLSX</button>
       </teleport>
       <teleport to="#plFiltersBody" v-if="isPhone">
        <div class="pl-sheet-foot pl-sheet-legend">
          <span class="pl-legend-item"><span class="pl-chip pl-chip--past">12h</span> Actuals (past)</span>
          <span class="pl-legend-item"><span class="pl-chip pl-chip--current">12h</span> {{ interval === 'weekly' ? 'Current week' : 'Current month' }}</span>
          <span class="pl-legend-item"><span class="pl-chip pl-chip--pulse">~1h</span> Monthly pulse</span>
          <template v-if="view === 'byowner'">
            <span class="pl-legend-item"><span class="pl-chip pl-chip--high">110h</span> High load</span>
            <span class="pl-legend-item"><span class="pl-chip pl-chip--over">140h</span> Over-allocated</span>
          </template>
        </div>
        <details class="pl-sheet-foot pl-sheet-details">
          <summary>How estimates work</summary>
          <div class="pl-popover-title">Estimation logic · {{ viewName }}</div>
          <p v-for="(t, i) in estimatesText" :key="i">{{ t }}</p>
        </details>
        <button type="button" class="btn btn-primary w-100 pl-sheet-foot pl-sheet-show" data-bs-dismiss="offcanvas">Show results</button>
       </teleport>
      </div>
    </div>
    <div v-if="isPhone && stepper.label" class="pl-stepper" role="group" aria-label="Period">
      <button type="button" class="pl-stepper-arrow" aria-label="Previous period" :disabled="!stepper.canPrev" @click="stepPeriod(-1)"><ph-icon name="chevron-left" :size="16"></ph-icon></button>
      <div class="pl-stepper-text" aria-live="polite">
        <div class="pl-stepper-label">{{ stepper.label }}</div>
        <div class="pl-stepper-sub" :class="{ 'is-current': stepper.current }">{{ stepper.sub }}</div>
      </div>
      <button type="button" class="pl-stepper-arrow" aria-label="Next period" :disabled="!stepper.canNext" @click="stepPeriod(1)"><ph-icon name="chevron-right" :size="16"></ph-icon></button>
    </div>
    <div class="pl-legend">
      <template v-if="!isTablet">
        <span class="pl-legend-item"><span class="pl-chip pl-chip--past">12h</span> Actuals (past)</span>
        <span class="pl-legend-item"><span class="pl-chip pl-chip--current">12h</span> {{ interval === 'weekly' ? 'Current week' : 'Current month' }}</span>
        <span class="pl-legend-item"><span class="pl-chip pl-chip--pulse">~1h</span> Monthly pulse</span>
        <template v-if="view === 'byowner'">
          <span class="pl-legend-item"><span class="pl-chip pl-chip--high">110h</span> High load</span>
          <span class="pl-legend-item"><span class="pl-chip pl-chip--over">140h</span> Over-allocated</span>
        </template>
      </template>
      <span class="pl-legend-info" ref="legendInfo">
        <button type="button" class="pl-link" ref="legendBtn" :aria-expanded="legendOpen ? 'true' : 'false'" aria-controls="plEstimatesPopover" @click="legendOpen = !legendOpen">
          <ph-icon name="info" :size="14"></ph-icon> How estimates work
        </button>
        <div v-if="legendOpen" id="plEstimatesPopover" class="pl-popover" role="dialog" aria-label="Estimation logic">
          <div class="pl-popover-title">Estimation logic · {{ viewName }}</div>
          <p v-for="(t, i) in estimatesText" :key="i">{{ t }}</p>
        </div>
      </span>
      <span class="pl-legend-actions">
        <button type="button" class="pl-link" @click="expandAll">Expand all</button>
        <button type="button" class="pl-link" @click="collapseAll">Collapse all</button>
      </span>
    </div>
    <div class="section-card pl-card">
      <div v-if="activeRows.state === 'placeholder'" class="pl-state" v-html="modelPlaceholderHtml()"></div>
      <div v-else-if="activeRows.state === 'empty'" class="pl-state"><div class="alert alert-info mb-0">{{ activeRows.message }}</div></div>
      <div v-else-if="!isPhone" class="pl-grid-wrap">
        <table class="pl-grid">
          <thead>
            <tr>
              <th class="pl-col-label" scope="col">{{ labelHeader }}</th>
              <th class="pl-col-num pl-col-sold" scope="col">Sold</th>
              <th class="pl-col-num pl-col-act" scope="col">Actuals</th>
              <th class="pl-col-num pl-col-plan" scope="col" title="To plan can exceed Sold − Actuals when a row aggregates several items and one is over-consumed: hours over budget on one are not subtracted from another's remaining budget.">To plan</th>
              <th v-for="(p, i) in activeRows.periods" :key="'h' + i" scope="col" class="pl-col-period"
                  :class="{ 'pl-cell--past': p.isPast, 'pl-cell--current': p.isCurrent }" :title="periodTitle(p)">
                <span class="pl-period-main">{{ periodMain(p) }}</span>
                <span class="pl-period-sub">{{ periodSub(p) }}</span>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr v-if="!displayRows.length">
              <td class="pl-empty-row" :colspan="4 + activeRows.periods.length">No rows match “{{ search[view] }}”.</td>
            </tr>
            <tr v-for="r in displayRows" :key="r.id"
                :class="[r.depth === 0 ? 'pl-row--parent' : 'pl-row--child', { 'pl-row--clickable': hasChildren(r) }]"
                @click="hasChildren(r) && toggleRow(r.id)">
              <td class="pl-col-label">
                <div class="pl-label" :style="{ '--pl-depth': r.depth }">
                  <button v-if="hasChildren(r)" type="button" class="pl-chevron" :aria-expanded="isOpen(r.id) ? 'true' : 'false'"
                          :aria-label="(isOpen(r.id) ? 'Collapse ' : 'Expand ') + r.label" @click.stop="toggleRow(r.id)">
                    <ph-icon :name="isOpen(r.id) ? 'chevron-down' : 'chevron-right'" :size="14"></ph-icon>
                  </button>
                  <span v-else class="pl-chevron-space"></span>
                  <span v-if="r.kind === 'tbd'" class="pl-avatars"><span class="pl-avatar pl-avatar--tbd" aria-hidden="true">?</span></span>
                  <span v-else-if="r.kind === 'person'" class="pl-avatars"><span class="pl-avatar" aria-hidden="true">{{ r.owners[0].initials }}</span></span>
                  <span v-else-if="r.kind === 'roleLeaf'" class="pl-avatars">
                    <span v-for="o in r.owners" :key="o.name" class="pl-avatar" :title="o.name" aria-hidden="true">{{ o.initials }}</span>
                    <span v-if="!r.owners.length" class="pl-avatar pl-avatar--tbd" aria-hidden="true">?</span>
                  </span>
                  <div class="pl-label-text">
                    <div class="pl-label-main">
                      <span class="pl-name" :title="r.label">{{ r.label }}</span>
                      <span v-if="r.inactive" class="pl-pill pl-pill--muted">inactive</span>
                      <span v-if="r.kind === 'tbd'" class="pl-pill pl-pill--warn">Needs owner</span>
                      <span v-if="r.kind === 'pair' && r.stage" v-html="stagePill(r.stage)"></span>
                    </div>
                    <div v-if="r.kind === 'project'" class="pl-sub">
                      <span v-if="r.stage" v-html="stagePill(r.stage)"></span>
                      <span v-if="r.status" v-html="statusPill(r.status)"></span>
                      <span class="pl-sub-text">{{ projectSub(r) }}</span>
                    </div>
                    <div v-else-if="r.kind === 'roleLeaf' && r.owners.length" class="pl-sub">
                      <span v-for="(o, i) in r.owners" :key="o.name" class="pl-sub-text">{{ o.name }}<span v-if="o.inactive" class="pl-pill pl-pill--muted ms-1">inactive</span>{{ i + 1 === r.owners.length ? '' : ',' }}</span>
                    </div>
                    <div v-else-if="r.sub" class="pl-sub"><span class="pl-sub-text">{{ r.sub }}</span></div>
                    <div class="pl-sub pl-sub--tablet">Sold {{ fmtNum(r.sold) }} · Actuals {{ fmtActuals(r.actuals) }}</div>
                  </div>
                </div>
              </td>
              <td class="pl-col-num pl-col-sold">{{ fmtNum(r.sold) }}</td>
              <td class="pl-col-num pl-col-act">{{ fmtActuals(r.actuals) }}</td>
              <td class="pl-col-num pl-col-plan">{{ fmtNum(r.toPlan) }}</td>
              <td v-for="(c, i) in r.cells" :key="i" class="pl-cell" :class="cellClass(c)" :title="cellTitle(c, i)">{{ cellText(c) }}</td>
            </tr>
          </tbody>
          <tfoot>
            <tr class="pl-total">
              <td class="pl-col-label">TOTAL · {{ activeRows.total.count }} ASSIGNMENTS</td>
              <td class="pl-col-num pl-col-sold">{{ fmtNum(activeRows.total.sold) }}</td>
              <td class="pl-col-num pl-col-act">{{ fmtActuals(activeRows.total.actuals) }}</td>
              <td class="pl-col-num pl-col-plan">{{ fmtNum(activeRows.total.toPlan) }}</td>
              <td v-for="(c, i) in activeRows.total.cells" :key="i" class="pl-cell" :class="{ 'pl-cell--past': c.past, 'pl-cell--current': c.current }">{{ cellText(c) }}</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div v-else class="pl-cards">
        <div v-if="!displayRows.length" class="pl-mcard pl-mcard--empty">No rows match “{{ search[view] }}”.</div>
        <div v-for="g in phoneGroups" :key="g.parent.id" class="pl-mcard" :class="{ 'is-open': hasChildren(g.parent) && isOpen(g.parent.id) }">
          <div class="pl-mcard-head" :role="hasChildren(g.parent) ? 'button' : null" :tabindex="hasChildren(g.parent) ? 0 : null"
               :aria-label="hasChildren(g.parent) ? cardHeadLabel(g.parent) : null"
               :aria-expanded="hasChildren(g.parent) ? (isOpen(g.parent.id) ? 'true' : 'false') : null"
               @click="hasChildren(g.parent) && toggleRow(g.parent.id)"
               @keydown.enter.prevent="hasChildren(g.parent) && toggleRow(g.parent.id)" @keydown.space.prevent="hasChildren(g.parent) && toggleRow(g.parent.id)">
            <div class="pl-mcard-top">
              <span v-if="g.parent.kind === 'tbd'" class="pl-avatars"><span class="pl-avatar pl-avatar--tbd" aria-hidden="true">?</span></span>
              <span v-else-if="g.parent.kind === 'person'" class="pl-avatars"><span class="pl-avatar" aria-hidden="true">{{ g.parent.owners[0].initials }}</span></span>
              <div class="pl-mcard-title">
                <div class="pl-label-main">
                  <span class="pl-name">{{ g.parent.label }}</span>
                  <span v-if="g.parent.inactive" class="pl-pill pl-pill--muted">inactive</span>
                  <span v-if="g.parent.kind === 'tbd'" class="pl-pill pl-pill--warn">Needs owner</span>
                  <span v-if="g.parent.kind === 'project' && g.parent.stage" v-html="stagePill(g.parent.stage)"></span>
                </div>
                <div class="pl-mcard-sub">{{ assignmentsText(leafCountMap.get(g.parent.id) ?? 0) }} · Sold {{ fmtNum(g.parent.sold) }}</div>
              </div>
              <div class="pl-mcard-figure">
                <span class="pl-mcard-value" :class="phoneCellClass(g.parent)">{{ phoneCellText(g.parent) }}</span>
                <span class="pl-mcard-plan">{{ fmtNum(g.parent.toPlan) }} to plan</span>
              </div>
            </div>
            <div class="pl-mbar" :class="{ 'pl-mbar--dense': g.parent.cells.length > 26 }" aria-hidden="true">
              <span v-for="(b, i) in miniBarOf(g.parent.cells)" :key="i" class="pl-mbar-seg" :class="['pl-mbar-seg--' + b.kind, { 'is-selected': i === phonePeriodIdx }]" :style="{ '--pl-ratio': Math.max(0.25, b.ratio) }"></span>
            </div>
          </div>
          <div v-for="c in g.children" :key="c.id" class="pl-mrow" :style="{ '--pl-depth': c.depth - 1 }"
               :class="{ 'pl-mrow--clickable': hasChildren(c) }" @click="hasChildren(c) && toggleRow(c.id)">
            <button v-if="hasChildren(c)" type="button" class="pl-chevron" :aria-expanded="isOpen(c.id) ? 'true' : 'false'"
                    :aria-label="(isOpen(c.id) ? 'Collapse ' : 'Expand ') + c.label" @click.stop="toggleRow(c.id)">
              <ph-icon :name="isOpen(c.id) ? 'chevron-down' : 'chevron-right'" :size="14"></ph-icon>
            </button>
            <span v-else-if="c.depth > 1" class="pl-chevron-space" aria-hidden="true"></span>
            <div class="pl-mrow-text">
              <div class="pl-label-main">
                <span class="pl-name">{{ c.label }}</span>
                <span v-if="c.inactive" class="pl-pill pl-pill--muted">inactive</span>
                <span v-if="c.kind === 'pair' && c.stage" v-html="stagePill(c.stage)"></span>
              </div>
              <div v-if="c.kind === 'roleLeaf' && c.owners.length" class="pl-mrow-sub">
                <span v-for="(o, i) in c.owners" :key="o.name">{{ o.name }}<span v-if="o.inactive" class="pl-pill pl-pill--muted ms-1">inactive</span>{{ i + 1 === c.owners.length ? '' : ', ' }}</span>
              </div>
              <div v-else-if="c.kind === 'project'" class="pl-mrow-sub">
                <span v-if="c.stage" v-html="stagePill(c.stage)"></span>
                <span v-if="c.status" v-html="statusPill(c.status)"></span>
                {{ projectSub(c) }}
              </div>
              <div v-else-if="c.sub" class="pl-mrow-sub">{{ c.sub }}</div>
            </div>
            <span class="pl-mrow-value" :class="phoneCellClass(c)">{{ phoneCellText(c) }}</span>
          </div>
        </div>
        <div class="pl-mcard pl-mcard--total">
          <div class="pl-mcard-top">
            <div class="pl-mcard-title">
              <div class="pl-mcard-total-label">TOTAL · {{ activeRows.total.count }} ASSIGNMENTS</div>
              <div class="pl-mcard-sub">{{ fmtNum(activeRows.total.toPlan) }} to plan</div>
            </div>
            <span class="pl-mcard-value" :class="phoneCellClass(activeRows.total)">{{ phoneCellText(activeRows.total) }}</span>
          </div>
          <div class="pl-mbar" :class="{ 'pl-mbar--dense': activeRows.total.cells.length > 26 }" aria-hidden="true">
            <span v-for="(b, i) in miniBarOf(activeRows.total.cells)" :key="i" class="pl-mbar-seg" :class="['pl-mbar-seg--' + b.kind, { 'is-selected': i === phonePeriodIdx }]" :style="{ '--pl-ratio': Math.max(0.25, b.ratio) }"></span>
          </div>
        </div>
      </div>
    </div>
    </template>
  </div>

<div v-if="isAdminUser" class="pl-ta-backdrop" :class="{ open: taOpen }" aria-hidden="true" @click="taOpen = false"></div>
<div id="teamAssistantPanel" v-if="isAdminUser" :class="{ open: taOpen }" role="dialog" aria-modal="true" aria-labelledby="taTitle" :aria-hidden="taOpen ? 'false' : 'true'">
  <div class="ta-header">
    <h2 class="ta-title" id="taTitle"><ph-icon name="team" :size="16"></ph-icon> Team assistant</h2>
    <button v-if="!isPhone" type="button" class="btn btn-ghost btn-icon" aria-label="Close Team assistant" @click="taOpen = false"><ph-icon name="close"></ph-icon></button>
    <button v-else type="button" class="btn btn-ghost pl-sheet-close" aria-label="Close Team assistant" @click="taOpen = false">Close</button>
  </div>
  <div class="ta-setup">
    <div class="ta-setup-row">
      <select class="form-select form-select-sm ta-select" ref="taSelect" aria-label="Project" v-model="taProjectId" :disabled="taBusy" @change="taNewChat()">
        <option value="">Select a project…</option>
        <option v-for="o in taProjectOptions" :key="o.id" :value="o.id">{{ o.label }}</option>
      </select>
      <button type="button" class="btn btn-primary btn-sm" :disabled="!taProjectId || taBusy" @click="taRank()">Calculate team</button>
      <button type="button" class="btn btn-outline-secondary btn-sm" :disabled="taBusy" @click="taNewChat()">New chat</button>
    </div>
    <div v-if="taProjectId && !taMessages.length" class="ta-starters">
      <button v-for="s in taStarters" :key="s" type="button" class="ta-starter" :disabled="taBusy" @click="taInput = s">{{ s }}</button>
    </div>
    <div v-if="!taProjectId" class="ta-hint">What do you want to do? Pick a project already in Planning, then ask for a team or press "Calculate team".</div>
  </div>
  <div class="ta-chat" ref="taChatEl" v-if="taMessages.length || taBusy">
    <div v-for="(m, i) in taMessages" :key="i" :class="['ta-msg', m.role === 'user' ? 'ta-msg--user' : 'ta-msg--bot']"
         v-html="renderChatText(m.content)"></div>
    <div v-if="taBusy" class="ta-msg ta-msg--bot ta-msg--busy"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Working…</div>
  </div>
  <div class="ta-composer" v-if="taProjectId">
    <textarea v-model="taInput" class="form-control form-control-sm" rows="2" :disabled="taBusy" aria-label="Message"
      placeholder="e.g. exclude Mario and only people with oncology experience"
      @keydown.enter="e => { if (shouldSendOnEnter(e)) { e.preventDefault(); taSend(); } }"></textarea>
    <button type="button" class="btn btn-primary btn-sm ta-send" :disabled="taBusy || !taInput.trim()" @click="taSend()">
      <span v-if="taBusy" class="spinner-border spinner-border-sm" role="status" aria-label="Sending"></span><span v-else>Send</span>
    </button>
  </div>
  <div class="ta-tables">
    <div v-if="taError" class="alert alert-warning alert-sm">{{ taError }}</div>
    <template v-if="taTables">
      <section v-for="key in ['best', 'alternative', 'available']" :key="key" class="ta-section">
        <h3 class="ta-section-title">{{ tableTitle(key) }}</h3>
        <div v-for="section in taTables[key]" :key="key + section.role" class="ta-role">
          <div class="ta-role-name">{{ section.role }}</div>
          <div v-if="!section.rows.length" class="ta-note">{{ section.note || 'Nobody.' }}</div>
          <div v-else-if="isPhone" class="ta-pcards">
            <div v-for="row in section.rows" :key="row.resourceId" class="ta-pcard">
              <div class="ta-pcard-top">
                <span class="ta-pcard-name">{{ rowView(row).name }}</span>
                <span class="ta-pcard-score">Score {{ rowView(row).score }}</span>
              </div>
              <div class="ta-pcard-role">{{ rowView(row).role }} · {{ rowView(row).roleHours }} h on role</div>
              <div class="ta-pcard-kpis">
                <span>Free {{ row.freeAvg == null ? '—' : Math.round(row.freeAvg) }} h/wk</span>
                <span>Load {{ rowView(row).load }}</span>
                <span>{{ rowView(row).onProject }} h on project</span>
              </div>
              <div v-if="(row.tags || []).length" class="ta-pcard-tags"><span v-for="t in row.tags" :key="t.value" class="pl-pill pl-pill--muted ta-tag">{{ t.value }} ({{ Math.round(t.hours) }} h)</span></div>
              <div v-if="rowView(row).flags" class="ta-flags">{{ rowView(row).flags }}</div>
              <div class="ta-pcard-rationale">{{ rowView(row).rationale }}</div>
            </div>
          </div>
          <div v-else class="ta-table-wrap">
            <table class="ta-table">
              <thead><tr>
                <th>Resource</th><th>Role</th><th>Score</th><th>h on role</th><th>Tags</th><th>Similar projects</th>
                <th>Similar tasks</th><th>Topics</th><th>Free h/wk</th><th>Current load</th><th>h on project</th><th>Rationale</th>
              </tr></thead>
              <tbody>
                <tr v-for="row in section.rows" :key="row.resourceId">
                  <td>{{ rowView(row).name }}<div v-if="rowView(row).flags" class="ta-flags">{{ rowView(row).flags }}</div></td>
                  <td>{{ rowView(row).role }}</td><td>{{ rowView(row).score }}</td><td>{{ rowView(row).roleHours }}</td>
                  <td><span v-for="t in (row.tags || [])" :key="t.value" class="pl-pill pl-pill--muted ta-tag">{{ t.value }} ({{ Math.round(t.hours) }} h)</span><span v-if="!(row.tags || []).length">—</span></td>
                  <td>{{ rowView(row).projects }}</td><td>{{ rowView(row).tasks }}</td>
                  <td>{{ rowView(row).topics }}</td><td>{{ rowView(row).free }}</td><td>{{ rowView(row).load }}</td>
                  <td>{{ rowView(row).onProject }}</td><td class="ta-rationale">{{ rowView(row).rationale }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </template>
  </div>
</div>

</div>
