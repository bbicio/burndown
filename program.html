<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/sidebar-state.js?v=1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDash — Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B1840'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Segoe UI,Arial,sans-serif' font-size='42' font-weight='700' fill='%23F0287A'%3EP%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/tokens.css?v=14">
  <link rel="stylesheet" href="css/style.css?v=38">
  <link rel="stylesheet" href="css/portfolio.css?v=9">
</head>
<body>

<div id="app-shell">
<div id="nav-container"></div>
<div id="app-main">

<div id="app" v-cloak class="app-container">

  <div v-if="loading" class="pg-skeleton">
    <div class="pg-skeleton-tile"></div>
    <div class="pg-skeleton-tile"></div>
    <div class="pg-skeleton-tile"></div>
    <div class="pg-skeleton-tile"></div>
  </div>

  <template v-else>
    <div class="ph">
      <div class="ph-main">
        <a href="/portfolio.html" class="ph-back"><ph-icon name="chevron-left" :size="12"></ph-icon>Portfolio</a>
        <div class="ph-eyebrow">Program dashboard</div>
        <div class="ph-title-row">
          <h1 class="ph-title">{{ program.name }}</h1>
          <span v-if="domPipeline" v-html="headerBadge('stage', domPipeline)"></span>
        </div>
        <div class="ph-sub">{{ metaLine }}</div>
      </div>
      <div class="ph-side"><div class="ph-actions">
        <button type="button" class="ph-btn" @click="exportBurndownPng"><ph-icon name="download" :size="14"></ph-icon>Export</button>
        <button type="button" class="ph-btn" @click="openShareModal('program', programId, program.name)"><ph-icon name="share" :size="14"></ph-icon>Share</button>
      </div></div>
    </div>

    <div v-if="!children.length" class="alert alert-info">
      No projects in this program are visible to you.
    </div>

    <template v-else>
      <div class="pg-kpis">
        <div class="pg-tile">
          <div class="pg-tile-label">Budget</div>
          <div class="pg-tile-value">{{ currency ? formatMoney(totals.spentMoney, currency, currencies) : 'Mixed currencies' }}
            <span v-if="currency" class="pg-tile-of">of {{ formatMoney(totals.soldMoney, currency, currencies) }}</span>
          </div>
          <div class="pf-spent-bar" :class="'pf-spent-' + spentBarState(totals.consumptionPct)">
            <div class="pf-spent-bar-fill" :style="{width: Math.min(100, totals.consumptionPct || 0) + '%'}"></div>
          </div>
          <div class="pg-tile-foot">
            <span>{{ totals.consumptionPct !== null ? totals.consumptionPct + '% spent' : '—' }}</span>
            <span class="pg-tile-right pg-text-success">{{ currency ? formatMoney(totals.remainingMoney, currency, currencies) + ' left' : 'Mixed currencies' }}</span>
          </div>
        </div>

        <div class="pg-tile">
          <div class="pg-tile-label">Hours</div>
          <div class="pg-tile-value">{{ fmtH(totals.spentHours) }}
            <span class="pg-tile-of">of {{ fmtH(totals.soldHours) }}</span>
          </div>
          <div class="pf-spent-bar" :class="'pf-spent-' + spentBarState(totals.consumptionPct)">
            <div class="pf-spent-bar-fill" :style="{width: Math.min(100, totals.consumptionPct || 0) + '%'}"></div>
          </div>
          <div class="pg-tile-foot">
            <span>{{ totals.consumptionPct !== null ? totals.consumptionPct + '% consumed' : '—' }}</span>
            <span class="pg-tile-right">{{ fmtH(totals.remainingHours) }} left</span>
          </div>
        </div>

        <div class="pg-tile">
          <div class="pg-tile-label">Time elapsed</div>
          <div class="pg-tile-value">{{ timeElapsedData.pct !== null ? timeElapsedData.pct + '%' : '—' }}
            <span v-if="rangeData" class="pg-tile-of">{{ fmtMonthFull(rangeData.startYm) }} – {{ fmtMonthFull(rangeData.endYm) }}</span>
          </div>
          <div class="pg-progress-bar">
            <div class="pg-progress-fill" :style="{width: (timeElapsedData.pct || 0) + '%'}"></div>
          </div>
          <div class="pg-tile-foot">
            <span>{{ timeElapsedData.startedCount }} of {{ timeElapsedData.totalCount }} projects started</span>
            <span class="pg-tile-right" v-if="programVsTime !== null">{{ programVsTime > 0 ? 'Consumption above time' : 'Consumption below time' }}</span>
          </div>
        </div>

        <button type="button" class="pg-tile pg-tile-attention" :class="{ 'pg-tile-attention-empty': !attention.ids.length }" :disabled="!attention.ids.length" @click="toggleAttentionFilter">
          <div class="pg-tile-label">{{ attention.ids.length ? ('Needs attention · ' + attention.ids.length) : 'Needs attention' }}</div>
          <div v-if="attention.ids.length" class="pg-attention-row">
            <div>
              <div class="pg-attention-name">{{ attentionWorstName }}</div>
              <div class="pg-attention-reason">{{ attention.reasons[attention.ids[0]] }}</div>
            </div>
            <span class="pg-attention-chevron">›</span>
          </div>
          <div v-else class="pg-tile-foot"><span>No projects need attention</span></div>
        </button>
      </div>

      <div class="pg-card pg-burndown-card">
        <div class="pg-card-head">
          <div>
            <div class="pg-card-title">Program burndown</div>
            <div class="pg-card-sub">Sum of remaining hours across {{ children.length }} project{{ children.length === 1 ? '' : 's' }}</div>
          </div>
          <div v-if="rangeData" class="pg-burndown-legend">
            <span class="pg-legend-item"><span class="pg-legend-line pg-legend-line-actual"></span>Remaining hours (actual)</span>
            <span class="pg-legend-item"><span class="pg-legend-line pg-legend-line-planned"></span>Remaining hours planned (phasing)</span>
            <button type="button" class="pf-clear-link pg-download-btn" title="Download PNG" @click="exportBurndownPng">Download PNG</button>
          </div>
        </div>
        <div v-if="!rangeData" class="pg-empty-chart">No dated projects in this program</div>
        <div v-else class="pg-chart-container">
          <canvas ref="burndownCanvas"></canvas>
        </div>
      </div>

      <div class="pg-card pg-projects-card">
        <div class="pg-card-head">
          <div class="pg-projects-head-left">
            <div class="pg-card-title">Projects</div>
            <div class="pg-view-seg">
              <button type="button" class="pg-view-btn" :class="{active: layout === 'list'}" @click="layout = 'list'">List</button>
              <button type="button" class="pg-view-btn pg-view-btn-timeline" :class="{active: layout === 'timeline'}" :disabled="!rangeData" @click="rangeData && (layout = 'timeline')">Timeline</button>
            </div>
          </div>
          <div class="pg-projects-head-right">
            <button v-if="attentionFilter" type="button" class="pf-clear-link" @click="attentionFilter = false">Showing flagged only · Clear</button>
            <span class="pg-reporting-note">Task, role and entry analysis is in each project's reporting</span>
          </div>
        </div>

        <template v-if="layout === 'list'">
        <div class="pg-list">
          <div class="pg-list-row pg-list-header">
            <div class="pg-cell-name">Project</div>
            <div class="pg-cell-status">Status</div>
            <div class="pg-cell-sold pg-list-amount">Sold</div>
            <div class="pg-cell-spent pg-list-amount">Spent</div>
            <div class="pg-cell-remaining pg-list-amount">Remaining</div>
            <div class="pg-cell-consumption">Consumption</div>
            <div class="pg-cell-vstime pg-list-amount">Vs time</div>
            <div class="pg-cell-action"></div>
          </div>
          <div v-for="row in visibleRows" :key="row.id" class="pg-list-row" :class="{ 'pg-list-row-flagged': row.flagged }">
            <div class="pg-cell-name pg-list-main">
              <div class="pg-list-name">{{ row.cfg.name }}</div>
              <div class="pg-list-sub">{{ row.cfg.code }}{{ row.cfg.code && row.cfg.startDate ? ' · ' : '' }}{{ row.cfg.startDate && row.cfg.endDate ? (fmtMonthShort(row.cfg.startDate) + ' – ' + fmtMonthShort(row.cfg.endDate)) : '' }}</div>
            </div>
            <div class="pg-cell-status"><span v-html="statusBadgeLarge(row.cfg.status)"></span></div>
            <div class="pg-cell-sold pg-list-amount">
              <template v-if="row.metrics.hasBudget">
                <div class="pg-list-amount-main">{{ fmtH(row.metrics.soldHours) }}</div>
                <div class="pg-list-amount-sub">{{ currency ? formatMoney(row.metrics.soldMoney, currency, currencies) : 'Mixed currencies' }}</div>
              </template>
              <template v-else>—</template>
            </div>
            <div class="pg-cell-spent pg-list-amount">
              <div class="pg-list-amount-main">{{ fmtH(row.metrics.spentHours) }}</div>
              <div class="pg-list-amount-sub">{{ currency ? formatMoney(row.metrics.spentMoney, currency, currencies) : 'Mixed currencies' }}</div>
              <div v-if="row.metrics.started && !row.metrics.hasActuals" class="pf-badge-neutral">No actuals</div>
            </div>
            <div class="pg-cell-remaining pg-list-amount">
              <template v-if="row.metrics.hasBudget">
                <div class="pg-list-amount-main">{{ fmtH(row.metrics.remainingHours) }}</div>
                <div class="pg-list-amount-sub">{{ currency ? formatMoney(row.metrics.remainingMoney, currency, currencies) : 'Mixed currencies' }}</div>
              </template>
              <template v-else>—</template>
            </div>
            <div class="pg-cell-consumption pg-list-consumption">
              <template v-if="row.metrics.hasBudget">
                <div class="pg-tick-bar" :class="'pf-spent-' + spentBarState(row.metrics.consumptionPct)">
                  <div class="pg-tick-fill pf-spent-bar-fill" :style="{width: Math.min(100, row.metrics.consumptionPct || 0) + '%'}"></div>
                  <div v-if="row.metrics.timePct !== null" class="pg-tick-mark" :style="{left: Math.min(100, row.metrics.timePct) + '%'}"></div>
                </div>
                <div class="pg-list-sub">{{ row.metrics.consumptionPct }}%</div>
              </template>
              <div v-else class="pf-badge-neutral">No budget</div>
            </div>
            <div class="pg-cell-vstime pg-list-amount" :class="vsTimeClass(row.metrics)">
              {{ fmtVsTime(row.metrics) }}
            </div>
            <div class="pg-cell-action">
              <button type="button" class="pf-clear-link" @click="goProjectReporting(row.id)">Reporting →</button>
            </div>
          </div>
          <div class="pg-list-row pg-list-total">
            <div class="pg-cell-name">PROGRAM TOTAL</div>
            <div class="pg-cell-status"></div>
            <div class="pg-cell-sold pg-list-amount">
              <div class="pg-list-amount-main">{{ fmtH(totals.soldHours) }}</div>
              <div class="pg-list-amount-sub">{{ currency ? formatMoney(totals.soldMoney, currency, currencies) : 'Mixed currencies' }}</div>
            </div>
            <div class="pg-cell-spent pg-list-amount">
              <div class="pg-list-amount-main">{{ fmtH(totals.spentHours) }}</div>
              <div class="pg-list-amount-sub">{{ currency ? formatMoney(totals.spentMoney, currency, currencies) : 'Mixed currencies' }}</div>
            </div>
            <div class="pg-cell-remaining pg-list-amount">
              <div class="pg-list-amount-main">{{ fmtH(totals.remainingHours) }}</div>
              <div class="pg-list-amount-sub">{{ currency ? formatMoney(totals.remainingMoney, currency, currencies) : 'Mixed currencies' }}</div>
            </div>
            <div class="pg-cell-consumption pg-list-consumption">
              <div class="pg-tick-bar" :class="'pf-spent-' + spentBarState(totals.consumptionPct)">
                <div class="pg-tick-fill pf-spent-bar-fill" :style="{width: Math.min(100, totals.consumptionPct || 0) + '%'}"></div>
              </div>
              <div class="pg-list-sub">{{ totals.consumptionPct !== null ? totals.consumptionPct + '%' : '—' }}</div>
            </div>
            <div class="pg-cell-vstime pg-list-amount" :class="vsTimeClass({ vsTime: programVsTime, started: true })">
              {{ programVsTime !== null ? (programVsTime > 0 ? '+' : '') + programVsTime + ' pt' : '—' }}
            </div>
            <div class="pg-cell-action"></div>
          </div>
        </div>
        </template>

        <template v-else-if="layout === 'timeline' && rangeData">
        <div class="pg-timeline">
          <div class="pg-timeline-axis">
            <div class="pg-timeline-axis-spacer"></div>
            <div class="pg-timeline-axis-track">
              <span v-for="(m, i) in rangeData.months" :key="m" class="pg-timeline-month" :style="{left: (i / rangeData.months.length * 100) + '%'}">{{ fmtMonthShort(m) }}</span>
            </div>
          </div>
          <div v-for="bar in timelineBarsData" :key="bar.id" class="pg-timeline-row" @click="goProjectReporting(bar.id)">
            <div class="pg-timeline-row-label">
              <div class="pg-list-name">{{ bar.name }}</div>
              <div class="pg-list-sub">{{ bar.started ? 'Started' : 'Not started' }} · {{ bar.consumptionPct !== null ? bar.consumptionPct : 0 }}% consumed</div>
            </div>
            <div class="pg-timeline-row-track">
              <div class="pg-timeline-bar" :class="['pf-spent-' + bar.state, { 'pg-timeline-bar-notstarted': !bar.started }]" :style="{left: bar.leftPct + '%', width: bar.widthPct + '%'}">
                <div class="pg-timeline-bar-fill pf-spent-bar-fill" :style="{width: bar.fillPct + '%'}"></div>
              </div>
            </div>
          </div>
          <template v-if="timelineTodayLeft">
            <div class="pg-timeline-today-line" :style="{left: timelineTodayLeft}"></div>
            <div class="pg-timeline-today-label" :style="{left: timelineTodayLeft}">Today</div>
          </template>
        </div>
        <div class="pg-timeline-legend">
          <span class="pg-legend-item"><span class="pg-legend-swatch pg-legend-duration"></span>Project duration</span>
          <span class="pg-legend-item"><span class="pg-legend-swatch pg-legend-consumed"></span>Budget consumed (amber ≥85%, red over sold)</span>
          <span class="pg-legend-item"><span class="pg-legend-swatch pg-legend-notstarted"></span>Not started</span>
        </div>
        </template>
      </div>
    </template>
  </template>
</div>

</div><!-- /#app-main -->
</div><!-- /#app-shell -->

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/vue@3.5.45/dist/vue.global.prod.js" integrity="sha384-K2FjvpG1y48yCE+7CBPhnKc16ShPmT3dlNwvoA3dhjV18+L5ugI0P8PWPvdjm/Fa" crossorigin="anonymous"></script>
<script defer src="js/api.js?v=20"></script>
<script defer src="js/core.js?v=17"></script>
<script type="module" src="js/lib/money.js?v=6"></script>
<script type="module" src="js/lib/notif-browser.js?v=2"></script>
<script type="module" src="js/lib/notification-url.js?v=1"></script>
<script defer src="js/notifications.js?v=6"></script>
<script defer src="js/clients.js"></script>
<script defer src="js/programs.js"></script>
<script type="module" src="js/lib/save.js?v=3"></script>
<script defer src="js/shares.js?v=1"></script>
<script type="module" src="js/lib/portfolio-calc.js?v=8"></script>
<script type="module" src="js/lib/program-calc.js?v=4"></script>
<script type="module" src="js/lib/chart-today.js?v=2"></script>
<script defer src="js/api-sync.js?v=34"></script>
<script type="module" src="js/lib/icons.js?v=7"></script>
<script defer src="js/nav.js?v=24"></script>
<script type="module" src="js/pages/program.js?v=1"></script>
</body>
</html>
