<!DOCTYPE html>
<html lang="en">
<head>
<script>try{if(localStorage.getItem('PDash_sidebarCollapsed')==='1')document.documentElement.setAttribute('data-sidebar','collapsed')}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDash — Timesheets</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/tokens.css?v=14">
  <link rel="stylesheet" href="css/style.css?v=38">
  <style>
    /* ── Actuals card (timesheets redesign, boards 11.1a–f) ── */
    .ts-card { padding: 0; }
    .ts-filters {
      display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2);
      padding: 14px 18px; border-bottom: 1px solid var(--border-light);
    }
    .ts-ctl {
      display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
      border: 1px solid var(--border-light); border-radius: var(--radius-md); background: var(--surface-white);
      font-size: 12.5px; color: var(--brand-navy); white-space: nowrap;
    }
    .ts-ctl:hover { border-color: var(--border-dark); }
    /* the active state sits on the .dropdown wrapper: a class binding on the toggle would wipe Bootstrap's .show */
    .ts-ctl.is-on, .dropdown.is-on > .ts-ctl { border-color: var(--brand-navy); font-weight: var(--weight-semibold); }
    .ts-ctl .pd-icon { color: var(--text-muted); }
    .ts-search { width: 250px; }
    .ts-search input { flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 12.5px; color: var(--brand-navy); }
    .ts-search input::placeholder { color: var(--text-placeholder); }
    .ts-search:focus-within, .ts-year:focus { border-color: var(--brand-magenta); box-shadow: 0 0 0 3px var(--focus-ring); outline: 0; }
    .ts-year { padding: 0 8px; cursor: pointer; }
    .ts-checklist { max-height: 260px; overflow-y: auto; min-width: 220px; font-size: 13px; }
    .ts-reset {
      display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 6px; border: 0; background: transparent;
      font-size: 12.5px; font-weight: var(--weight-semibold); color: var(--text-muted);
    }
    .ts-reset:hover { color: var(--brand-navy); }
    .ts-note {
      display: flex; align-items: flex-start; gap: 10px; margin: 12px 18px 0; padding: 9px 12px;
      border-radius: var(--radius-md); background: var(--surface-light); font-size: 12px; color: var(--text-secondary); line-height: 1.5;
    }
    .ts-note .pd-icon { flex: 0 0 auto; margin-top: 2px; color: var(--text-muted); }

    .ts-grid { display: grid; grid-template-columns: minmax(0, 1.9fr) 160px 60px 64px 96px 140px; gap: 12px; align-items: center; }
    .ts-head { padding: 14px 18px 8px; font-size: 10px; font-weight: var(--weight-bold); letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
    .ts-sort { display: inline-flex; align-items: center; gap: 3px; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
    .ts-sort:hover, .ts-sort.is-on { color: var(--brand-navy); }
    .ts-sort .pd-icon.is-asc { transform: rotate(180deg); }
    .ts-sep { color: var(--border-dark); margin: 0 6px; }
    .ts-num { text-align: right; }

    .ts-group {
      display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 18px;
      border: 0; border-top: 1px solid var(--border-light); background: var(--surface-light); text-align: left; cursor: pointer;
    }
    .ts-group .pd-icon { color: var(--text-muted); transition: transform var(--duration-fast); }
    .ts-group.is-collapsed .pd-icon { transform: rotate(-90deg); }
    .ts-group-name { font-size: 13px; font-weight: var(--weight-bold); color: var(--brand-navy); }
    .ts-group-meta { font-size: 11.5px; color: var(--text-muted); }

    .ts-row { padding: 10px 18px 10px 40px; min-height: 52px; border-top: 1px solid var(--border-light); }
    .ts-row:hover { background: var(--surface-light); }
    .ts-project { font-size: 13px; font-weight: var(--weight-semibold); color: var(--brand-navy); line-height: 1.35; overflow-wrap: anywhere; }
    .ts-client, .ts-sub, .ts-act-label { display: none; }
    .ts-code {
      justify-self: start; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px;
      color: var(--brand-navy); background: var(--surface-subtle); border-radius: var(--radius-sm); padding: 3px 7px; white-space: nowrap;
    }
    .ts-uploads { font-size: 12.5px; color: var(--text-muted); text-align: right; }
    .ts-rows { font-size: 13px; font-weight: var(--weight-bold); color: var(--brand-navy); text-align: right; }
    .ts-last { font-size: 12.5px; color: var(--text-secondary); }
    .ts-actions { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
    .ts-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 10px;
      border: 1px solid var(--border-light); border-radius: 7px; background: var(--surface-white);
      font-size: 12px; font-weight: var(--weight-semibold); color: var(--brand-navy); white-space: nowrap;
    }
    .ts-btn:hover:not(:disabled) { border-color: var(--border-dark); }
    .ts-btn:disabled { opacity: .6; cursor: default; }
    .ts-btn.is-icon { width: 30px; padding: 0; }
    .ts-btn.is-more { border-color: transparent; color: var(--text-muted); }
    .ts-btn.is-more:hover:not(:disabled), .ts-btn.is-more[aria-expanded="true"] { background: var(--surface-subtle); color: var(--brand-navy); }
    .ts-btn .spinner-border { width: 14px; height: 14px; border-width: 2px; }
    .ts-menu { width: 272px; padding: 4px; border-radius: 10px; box-shadow: var(--shadow-lg); }
    .ts-menu-item {
      display: flex; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 7px; background: transparent; text-align: left;
    }
    .ts-menu-item:hover, .ts-menu-item:focus-visible { background: var(--color-danger-bg); outline: 0; }
    .ts-menu-item .pd-icon { flex: 0 0 auto; margin-top: 2px; color: var(--color-danger-text); }
    .ts-menu-label { display: block; font-size: 12.5px; font-weight: var(--weight-bold); color: var(--color-danger-text); }
    .ts-menu-hint { display: block; font-size: 11.5px; color: var(--text-muted); line-height: 1.4; white-space: normal; }

    .ts-state { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); padding: 56px 24px 64px; text-align: center; }
    .ts-state.is-nomatch { border-top: 1px solid var(--border-light); padding: 48px 24px 56px; }
    .ts-state-icon { width: 44px; height: 44px; border-radius: var(--radius-lg); background: var(--surface-subtle); display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
    .ts-state-title { font-size: 14px; font-weight: var(--weight-bold); color: var(--brand-navy); }
    .ts-state-text { font-size: 12.5px; color: var(--text-muted); max-width: 420px; }
    .ts-link { border: 0; background: transparent; padding: 0; font-size: 12.5px; font-weight: var(--weight-semibold); color: var(--brand-navy); text-decoration: underline; }
    .ts-link:hover { color: var(--brand-magenta); }
    .ts-loading { display: flex; align-items: center; justify-content: center; height: 40vh; }

    /* ── View modal (11.1c) ── */
    .ts-scrim { position: fixed; inset: 0; z-index: calc(var(--z-modal) - 1); background: var(--brand-navy); opacity: .35; }
    .ts-view {
      position: fixed; z-index: var(--z-modal); top: 32px; bottom: 32px; left: 64px; right: 64px;
      background: var(--surface-white); border-radius: 14px; box-shadow: var(--shadow-xl);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .ts-view-head { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 14px 16px 14px 20px; border-bottom: 1px solid var(--border-light); }
    .ts-view-head .ts-code { font-size: 13px; font-weight: var(--weight-semibold); padding: 4px 8px; }
    .ts-view-count { flex: 1 1 auto; font-size: 12.5px; color: var(--text-muted); }
    .ts-close { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--text-muted); }
    .ts-close:hover { background: var(--surface-subtle); color: var(--brand-navy); }
    .ts-view-body { flex: 1 1 auto; min-height: 0; overflow: auto; }
    .ts-vgrid { display: grid; grid-template-columns: 92px 150px 210px 170px 56px minmax(0, 1fr) 88px 92px; gap: 12px; align-items: center; padding: 0 20px; min-width: 1040px; }
    .ts-vhead {
      position: sticky; top: 0; z-index: 1; padding-top: 9px; padding-bottom: 9px; background: var(--surface-light);
      border-bottom: 1px solid var(--border-light); font-size: 10px; font-weight: var(--weight-bold); letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted);
    }
    .ts-vrow { height: 34px; border-bottom: 1px solid var(--surface-subtle); font-size: 12px; color: var(--text-secondary); }
    .ts-vrow:hover { background: var(--surface-light); }
    .ts-vrow > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ts-vdate, .ts-vnotes { color: var(--text-muted); }
    .ts-vstrong { font-weight: var(--weight-bold); color: var(--brand-navy); }
    .ts-tab { font-variant-numeric: tabular-nums; text-align: right; }

    /* phone-only pieces; the filter set is transparent to the filters row until it becomes the phone sheet */
    .ts-filter-set { display: contents; }
    .ts-sheet-btn, .ts-sheet-head, .ts-sheet-done, .ts-sheet-scrim, .ts-rows-unit { display: none; }

    /* ── Tablet (11.3) ── */
    @media (min-width: 768px) and (max-width: 1399.98px) {
      .ts-filters { padding: 12px 16px; }
      .ts-search { flex: 1 1 100%; width: auto; }
      .ts-ctl, .ts-reset { height: 40px; }
      .ts-grid { grid-template-columns: minmax(0, 1fr) 64px 100px 168px; }
      .ts-col-uploads, .ts-col-code { display: none; }
      .ts-head { padding: 12px 16px 6px; }
      .ts-group { padding: 0 16px; }
      .ts-row { padding: 9px 16px 9px 28px; min-height: 60px; }
      .ts-sub { display: block; font-size: 11.5px; color: var(--text-muted); overflow-wrap: anywhere; }
      .ts-btn { height: 40px; padding: 0 12px; border-radius: var(--radius-md); }
      .ts-btn.is-icon { width: 40px; }
    }

    /* ── Smartphone (11.3): one card per code, filters in a bottom sheet, View full screen ── */
    @media (max-width: 767.98px) {
      .ts-card { background: transparent; border: 0; }
      .ts-filters { padding: 0 0 var(--space-2); border: 0; flex-wrap: nowrap; }
      .ts-search { flex: 1 1 auto; width: auto; min-height: 44px; border-radius: 10px; }
      .ts-sheet-btn { display: inline-flex; min-height: 44px; border-radius: 10px; font-size: 13px; }
      .ts-reset { display: none; }
      .ts-filter-set { display: none; }
      .ts-filter-set.is-open {
        display: flex; flex-direction: column; gap: var(--space-3);
        position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-modal);
        padding: 16px 16px 20px; background: var(--surface-white);
        border-radius: 16px 16px 0 0; box-shadow: var(--shadow-xl);
      }
      .ts-sheet-scrim { display: block; position: fixed; inset: 0; z-index: calc(var(--z-modal) - 1); background: var(--brand-navy); opacity: .35; }
      .ts-sheet-head { display: flex; align-items: center; justify-content: space-between; }
      .ts-sheet-title { font-size: 16px; font-weight: var(--weight-bold); color: var(--brand-navy); }
      .ts-filter-set .ts-ctl { width: 100%; min-height: 44px; justify-content: space-between; }
      .ts-sheet-done { display: block; min-height: 44px; }
      .ts-note { margin: 0 0 var(--space-2); }
      .ts-head { display: none; }
      .ts-group {
        position: sticky; top: 0; z-index: 1; height: auto; min-height: 44px; padding: 0 2px;
        border: 0; background: var(--surface-subtle);
      }
      .ts-group-name { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
      .ts-row {
        display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
        grid-template-areas: "main main main" "code rows last" "act act act";
        gap: 6px 8px; margin-bottom: var(--space-2); padding: 12px 14px 0; min-height: 0;
        background: var(--surface-white); border: 1px solid var(--border-light); border-radius: var(--radius-lg);
      }
      .ts-row:hover { background: var(--surface-white); }
      .ts-main { grid-area: main; display: flex; flex-direction: column; gap: 6px; }
      .ts-client { display: block; font-size: 11.5px; color: var(--text-muted); }
      .ts-project { font-size: 14px; line-height: 1.3; }
      .ts-sub, .ts-uploads { display: none; }
      .ts-code { grid-area: code; font-size: 11px; padding: 2px 6px; }
      .ts-rows { grid-area: rows; justify-self: end; font-size: 12px; }
      .ts-rows-unit { display: inline; font-weight: var(--weight-regular); color: var(--text-secondary); }
      .ts-last { grid-area: last; font-size: 12px; }
      .ts-last::before { content: '· '; color: var(--text-muted); }
      .ts-actions { grid-area: act; gap: 0; margin: 4px -14px 0; border-top: 1px solid var(--border-light); }
      .ts-actions > .ts-btn, .ts-actions > .dropdown { flex: 1 1 0; }
      .ts-btn { width: 100%; min-height: 44px; border: 0; border-radius: 0; font-size: 13px; }
      .ts-btn.is-icon { width: 100%; }
      .ts-actions > .ts-btn + .ts-btn, .ts-actions > .dropdown { border-left: 1px solid var(--border-light); }
      .ts-actions > .dropdown { flex: 0 0 52px; }
      .ts-actions > .ts-btn .pd-icon { display: none; }
      .ts-act-label { display: inline; }
      .ts-view { inset: 0; border-radius: 0; }
    }
    /* 1024–1279px: the open sidebar leaves no room for the sub-nav column, so it becomes the tablet tabs (11.3) */
    @media (min-width: 1024px) and (max-width: 1279.98px) {
      .ph:has(+ .md-layout) { border-bottom: 0; }
      .md-layout { display: block; padding: 0; }
      .md-subnav {
        position: static; display: flex; overflow-x: auto; scrollbar-width: none; padding: 10px 24px;
        background: var(--surface-white); border: 0; border-bottom: 1px solid var(--border-light); border-radius: 0;
      }
      .md-subnav-list { display: flex; gap: var(--space-1); }
      .md-subnav-group { display: none; }
      .md-subnav-item { height: 36px; padding: 0 12px; white-space: nowrap; }
      .md-subnav-item.active { background: var(--surface-white); border: 1px solid var(--border-light); box-shadow: inset 0 -3px 0 var(--brand-magenta); }
      .md-content { padding: var(--space-4) 24px 24px; }
    }
  </style>
</head>
<body>

<div id="app-shell">
<div id="nav-container"></div>
<div id="app-main">

<div class="ph">
  <div class="ph-main">
    <div class="ph-title-row"><h1 class="ph-title">Timesheets</h1></div>
    <div class="ph-sub">Uploaded actuals and the experience profiles built from them.</div>
  </div>
</div>
<div class="md-layout">
<nav class="md-subnav" data-subnav-set="timesheets" data-md-active="actuals" aria-label="Timesheets"></nav>
<div class="md-content">

<div id="app" v-cloak>
  <div v-if="error" class="alert alert-danger alert-sm mb-3">{{ error }}</div>

  <section class="md-card ts-card">
    <div v-if="!ready" class="ts-loading"><div class="spinner-border text-secondary"></div></div>
    <template v-else>
      <!-- ── FILTERS ─────────────────────────────────────────── -->
      <div class="ts-filters">
        <label class="ts-ctl ts-search">
          <ph-icon name="search" :size="13"></ph-icon>
          <input type="text" placeholder="Filter by project code…" v-model="filters.code" aria-label="Filter by project code">
        </label>
        <button type="button" class="ts-ctl ts-sheet-btn" :class="{ 'is-on': sheetCount }" @click="openSheet"><ph-icon name="filter" :size="14"></ph-icon>{{ 'Filters' + (sheetCount ? ' (' + sheetCount + ')' : '') }}</button>
        <div v-if="sheetOpen" class="ts-sheet-scrim" @click="closeSheet"></div>
        <div class="ts-filter-set" :class="{ 'is-open': sheetOpen }" :role="sheetOpen ? 'dialog' : null" :aria-modal="sheetOpen ? 'true' : null" :aria-label="sheetOpen ? 'Filters' : null">
        <div class="ts-sheet-head"><span class="ts-sheet-title">Filters</span><button type="button" class="ts-close" title="Close" aria-label="Close" @click="closeSheet"><ph-icon name="close" :size="16"></ph-icon></button></div>
        <div class="dropdown" :class="{ 'is-on': filters.clients.length }">
          <button type="button" class="ts-ctl" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
            {{ 'Client' + (filters.clients.length ? ' (' + filters.clients.length + ')' : '') }}<ph-icon name="chevron-down" :size="11"></ph-icon>
          </button>
          <ul class="dropdown-menu p-2 ts-checklist">
            <li v-for="name in clientOptions" :key="name" class="form-check">
              <input class="form-check-input" type="checkbox" :id="'cf-' + name" :value="name" v-model="filters.clients">
              <label class="form-check-label" :for="'cf-' + name">{{ name }}</label>
            </li>
            <li v-if="!clientOptions.length" class="text-muted small px-2">No data</li>
          </ul>
        </div>
        <div class="dropdown" :class="{ 'is-on': filters.projects.length }">
          <button type="button" class="ts-ctl" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
            {{ 'Project' + (filters.projects.length ? ' (' + filters.projects.length + ')' : '') }}<ph-icon name="chevron-down" :size="11"></ph-icon>
          </button>
          <ul class="dropdown-menu p-2 ts-checklist">
            <li v-for="name in projectOptions" :key="name" class="form-check">
              <input class="form-check-input" type="checkbox" :id="'pf-' + name" :value="name" v-model="filters.projects">
              <label class="form-check-label" :for="'pf-' + name">{{ name }}</label>
            </li>
            <li v-if="!projectOptions.length" class="text-muted small px-2">No data</li>
          </ul>
        </div>
        <select class="ts-ctl ts-year" v-model.number="filters.year" aria-label="Pipeline year">
          <option :value="0">All years</option>
          <option v-for="py in pipelineYears" :key="py.year" :value="py.year">Pipeline {{ py.year }}</option>
        </select>
        <button type="button" class="btn btn-primary ts-sheet-done" @click="closeSheet">Done</button>
        </div>
        <button v-if="filtersOn" type="button" class="ts-reset" @click="resetFilters"><ph-icon name="reset" :size="12"></ph-icon>Reset filters</button>
      </div>

      <!-- ── INFO NOTE ───────────────────────────────────────── -->
      <div class="ts-note">
        <ph-icon name="info" :size="14"></ph-icon>
        <span>Each row represents one project code. Uploading a new XLS for a project replaces all previous data for that code.
          <strong>Delete actuals</strong> permanently removes every timesheet row for that project from the database.
          Use <strong>Load Actuals</strong> in Portfolio to import new data.</span>
      </div>

      <!-- ── GROUPED LIST ────────────────────────────────────── -->
      <template v-if="groups.length">
        <div class="ts-grid ts-head">
          <span>
            <button type="button" class="ts-sort" :class="{ 'is-on': sort.sortBy === 'client_name' }" @click="toggleSort('client_name')">Client<ph-icon v-if="sort.sortBy === 'client_name'" name="chevron-down" :size="10" :class="{ 'is-asc': sort.sortDir === 'asc' }"></ph-icon></button><span class="ts-sep">/</span><button type="button" class="ts-sort" :class="{ 'is-on': sort.sortBy === 'project_name' }" @click="toggleSort('project_name')">Project<ph-icon v-if="sort.sortBy === 'project_name'" name="chevron-down" :size="10" :class="{ 'is-asc': sort.sortDir === 'asc' }"></ph-icon></button>
          </span>
          <span class="ts-col-code"><button type="button" class="ts-sort" :class="{ 'is-on': sort.sortBy === 'project_code' }" @click="toggleSort('project_code')">Project code<ph-icon v-if="sort.sortBy === 'project_code'" name="chevron-down" :size="10" :class="{ 'is-asc': sort.sortDir === 'asc' }"></ph-icon></button></span>
          <span class="ts-num ts-col-uploads">Uploads</span><span class="ts-num">Rows</span><span>Last uploaded</span><span></span>
        </div>
        <template v-for="g in groups" :key="g.key">
          <button type="button" class="ts-group" :class="{ 'is-collapsed': collapsed[g.key] }" :aria-expanded="!collapsed[g.key]" @click="toggleGroup(g.key)">
            <ph-icon name="chevron-down" :size="12"></ph-icon>
            <span class="ts-group-name">{{ g.label }}</span>
            <span class="ts-group-meta">{{ groupMeta(g) }}</span>
          </button>
          <template v-if="!collapsed[g.key]">
            <div v-for="r in g.rows" :key="r.project_code" class="ts-grid ts-row">
              <div class="ts-main">
                <span class="ts-client">{{ g.label }}</span>
                <span class="ts-project">{{ r.project_name || '—' }}</span>
                <span class="ts-sub">{{ g.label }} · {{ r.project_code }}</span>
              </div>
              <span class="ts-code ts-col-code">{{ r.project_code }}</span>
              <span class="ts-uploads ts-col-uploads">{{ r.uploads }}</span>
              <span class="ts-rows">{{ fmtCount(r.total_rows) }}<span class="ts-rows-unit"> rows</span></span>
              <span class="ts-last">{{ fmtDate(r.last_uploaded) }}</span>
              <div class="ts-actions">
                <button type="button" class="ts-btn" @click="viewRows(r)"><ph-icon name="eye" :size="13"></ph-icon><span>View</span></button>
                <button type="button" class="ts-btn is-icon" title="Download actuals (.xlsx)" aria-label="Download actuals (.xlsx)"
                        :disabled="r._downloading" @click="downloadXlsx(r)">
                  <span v-if="r._downloading" class="spinner-border" role="status"></span>
                  <ph-icon v-else name="download" :size="14"></ph-icon><span class="ts-act-label">Download</span>
                </button>
                <div class="dropdown">
                  <button type="button" class="ts-btn is-icon is-more" title="More" aria-label="More actions"
                          data-bs-toggle="dropdown" aria-expanded="false" :disabled="r._loading">
                    <span v-if="r._loading" class="spinner-border" role="status"></span>
                    <ph-icon v-else name="more" :size="16"></ph-icon>
                  </button>
                  <div class="dropdown-menu dropdown-menu-end ts-menu">
                    <button type="button" class="ts-menu-item" @click="deleteCode(r)">
                      <ph-icon name="trash" :size="14"></ph-icon>
                      <span><span class="ts-menu-label">Delete actuals</span>
                        <span class="ts-menu-hint">Removes {{ fmtCount(r.total_rows) }} rows and re-queues the code for profile processing. Cannot be undone.</span></span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </template>
      </template>

      <!-- ── STATES ──────────────────────────────────────────── -->
      <div v-else-if="!rows.length" class="ts-state">
        <div class="ts-state-icon"><ph-icon name="folder" :size="20"></ph-icon></div>
        <span class="ts-state-title">No timesheets uploaded yet.</span>
        <span class="ts-state-text">Use <strong>Load Actuals</strong> in the Portfolio view to import a timesheet export for a project.</span>
      </div>
      <div v-else class="ts-state is-nomatch">
        <div class="ts-state-icon"><ph-icon name="search" :size="18"></ph-icon></div>
        <span class="ts-state-title">No timesheets match the current filters.</span>
        <button type="button" class="ts-link" @click="resetFilters">Reset filters</button>
      </div>
    </template>
  </section>

  <!-- ── VIEW MODAL (11.1c) ──────────────────────────────────── -->
  <template v-if="modal.show">
    <div class="ts-scrim" @click="closeView"></div>
    <div class="ts-view" role="dialog" aria-modal="true" :aria-label="'Actuals ' + modal.code">
      <div class="ts-view-head">
        <span class="ts-code">{{ modal.code }}</span>
        <span class="ts-view-count">{{ modal.loading ? '' : fmtCount(modal.rows.length) + ' rows' }}</span>
        <button type="button" class="ts-close" title="Close" aria-label="Close" @click="closeView"><ph-icon name="close" :size="16"></ph-icon></button>
      </div>
      <div class="ts-view-body">
        <div v-if="modal.loading" class="ts-loading"><div class="spinner-border text-secondary"></div></div>
        <template v-else>
          <div class="ts-vgrid ts-vhead">
            <span>Date</span><span>Owner</span><span>Role</span><span>Task</span><span class="ts-tab">Hours</span><span>Notes</span>
            <span class="ts-tab">Fee</span><span class="ts-tab">Spent</span>
          </div>
          <div v-for="(row, i) in modal.rows" :key="i" class="ts-vgrid ts-vrow">
            <span class="ts-vdate">{{ row.date }}</span>
            <span>{{ row.owner }}</span>
            <span :title="row.role">{{ row.role }}</span>
            <span>{{ row.task }}</span>
            <span class="ts-tab ts-vstrong">{{ row.hours }}</span>
            <span class="ts-vnotes" :title="row.notes">{{ row.notes }}</span>
            <span class="ts-tab">{{ formatMoney(row.fee || 0, modal.currency || 'EUR', currencies) }}</span>
            <span class="ts-tab ts-vstrong">{{ formatMoney((row.fee || 0) * (row.hours || 0), modal.currency || 'EUR', currencies) }}</span>
          </div>
        </template>
      </div>
    </div>
  </template>
</div><!-- #app -->

</div><!-- /.md-content -->
</div><!-- /.md-layout -->

<!-- Confirm (used by showConfirm() in js/core.js) -->
<div class="modal fade" id="confirmModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered" style="max-width:460px">
    <div class="modal-content shadow-lg">
      <div class="modal-header border-0 pb-1">
        <h6 class="modal-title fw-bold" id="confirmModalTitle">Confirm</h6>
      </div>
      <div class="modal-body pt-1">
        <p id="confirmModalMessage" class="mb-0" style="white-space:pre-line;font-size:.92rem"></p>
      </div>
      <div class="modal-footer border-0 pt-2">
        <button class="btn btn-secondary" id="confirmModalCancel" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" id="confirmModalOk">Confirm</button>
      </div>
    </div>
  </div>
</div>

</div><!-- /#app-main -->
</div><!-- /#app-shell -->
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script defer src="js/api.js?v=15"></script>
<script defer src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
<script defer src="js/core.js?v=16"></script>
<script type="module" src="js/lib/notif-browser.js?v=2"></script>
<script type="module" src="js/lib/money.js?v=6"></script>
<script defer src="js/notifications.js?v=4"></script>
<script type="module" src="js/lib/icons.js?v=7"></script>
<script type="module" src="js/lib/md-subnav.js?v=7"></script>
<script type="module" src="js/lib/timesheets-list.js?v=2"></script>
<script defer src="js/nav.js?v=24"></script>
<script type="module">
  const app = Vue.createApp({
    data() {
      return {
        ready: false,
        formatMoney: window.formatMoney,
        currencies: [],
        rows:  [],
        error: null,
        modal: { show: false, loading: false, code: '', rows: [], currency: null },
        pipelineYears: [],
        filters: { year: 0, clients: [], projects: [], code: '' }, // year 0 = "All years"
        sort: { sortBy: null, sortDir: 'asc' },
        collapsed: {},          // client group key → true; session only, never persisted
        sheetOpen: false,       // phone: the Client / Project / year bottom sheet
      };
    },
    computed: {
      clientOptions() { return filterOptions(this.rows, 'client_name'); },
      projectOptions() { return filterOptions(this.rows, 'project_name'); },
      filteredRows() { return filterTimesheetRows(this.rows, this.filters); },
      groups() { return groupTimesheetRows(this.filteredRows, this.sort); },
      filtersOn() { return hasActiveFilters(this.filters); },
      sheetCount() {
        const f = this.filters;
        return (f.clients.length ? 1 : 0) + (f.projects.length ? 1 : 0) + (f.year !== 0 ? 1 : 0);
      },
    },
    async created() {
      const user = await initNav('timesheets', { breadcrumbs: [
        { label: 'Home', href: '/pipeline.html' },
        { label: 'Timesheets' },
      ]});
      if (!user) return;
      if (!['admin', 'sysadmin'].includes(user.role)) { window.location.href = '/pipeline.html'; return; }
      const [pipelineYearsResult, currenciesResult] = await Promise.allSettled([
        Api.pipelineYears.list(),
        Api.currencies.active(),
        this.loadRows(),
      ]);
      this.pipelineYears = pipelineYearsResult.status === 'fulfilled' ? pipelineYearsResult.value : [];
      window.__currencies = currenciesResult.status === 'fulfilled'
        ? currenciesResult.value
        : [{ code: 'EUR', symbol: '€', locale: 'it-IT' }];
      this.currencies = window.__currencies;
      const currentYear = new Date().getFullYear();
      const hasCurrentYear = this.pipelineYears.some(py => py.year === currentYear);
      this.filters.year = hasCurrentYear ? currentYear
        : (this.pipelineYears.length ? this.pipelineYears[0].year : 0);
      this.ready = true;
      this.loadProfileQueueCount();   // badge only: not awaited, never blocks the page
      // Capture phase, before Bootstrap's handler hides the menu: was a dropdown really open for this Esc?
      document.addEventListener('keydown', e => { this._escForDropdown = e.key === 'Escape' && !!document.querySelector('.dropdown-menu.show'); }, true);
      document.addEventListener('keydown', this.onKeydown);
      // leaving the phone breakpoint turns the sheet back into the inline filters row
      const phone = window.matchMedia('(max-width: 767.98px)');
      phone.addEventListener('change', q => { if (!q.matches && this.sheetOpen) this.closeSheet(); });
    },
    methods: {
      // One GET /api/profile-jobs for the sub-nav badge; any failure hides it.
      async loadProfileQueueCount() {
        try {
          const res = await fetch('/api/profile-jobs', { credentials: 'same-origin' });
          if (!res.ok) throw new Error();
          const n = Number((await res.json()).queuedCount) || 0;
          setSubnavBadge('profileJobs', n, n + ' project code' + (n === 1 ? '' : 's') + ' waiting for profile processing');
        } catch { setSubnavBadge('profileJobs', 0); }
      },
      toggleSort(field) { this.sort = nextSortState(this.sort, field); },
      toggleGroup(key) { this.collapsed = { ...this.collapsed, [key]: !this.collapsed[key] }; },
      groupMeta(g) {
        return `${g.codes} code${g.codes === 1 ? '' : 's'} · ${this.fmtCount(g.totalRows)} rows`;
      },
      resetFilters() {
        this.filters = { year: 0, clients: [], projects: [], code: '' };
      },
      openSheet() {
        this._sheetReturn = document.activeElement;
        this.sheetOpen = true;
        this.$nextTick(() => { const c = document.querySelector('.ts-filter-set.is-open .ts-close'); if (c) c.focus(); });
      },
      closeSheet() {
        this.sheetOpen = false;
        this.$nextTick(() => { if (this._sheetReturn && this._sheetReturn.focus) this._sheetReturn.focus(); });
      },
      onKeydown(e) {
        if (document.querySelector('.modal.show')) return;
        if (e.key === 'Escape') {
          // Bootstrap closes a dropdown on Esc only when the event comes from its toggle or menu
          if (this._escForDropdown && e.target.closest && e.target.closest('.dropdown-menu, [data-bs-toggle="dropdown"]')) return;
          if (this.modal.show) this.closeView();
          else if (this.sheetOpen) this.closeSheet();
          return;
        }
        if (e.key !== 'Tab') return;
        // Tab stays inside the open View modal, or else inside the open phone Filters sheet
        const box = this.modal.show ? document.querySelector('.ts-view')
          : this.sheetOpen ? document.querySelector('.ts-filter-set.is-open') : null;
        const items = box ? [...box.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])')]
          .filter(el => el.offsetParent !== null) : [];
        if (!items.length) return;
        const first = items[0];
        const last = items[items.length - 1];
        if (e.shiftKey && (document.activeElement === first || !box.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && (document.activeElement === last || !box.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
      },
      closeView() {
        this.modal.show = false;
        this.$nextTick(() => { if (this._returnFocus && this._returnFocus.focus) this._returnFocus.focus(); });
      },
      async loadRows() {
        this.error = null;
        try {
          this.rows = await Api.timesheets.list();
        } catch (e) {
          this.error = e.message || 'Failed to load timesheets.';
        }
      },
      deleteCode(row) {
        if (row._loading) return;
        const code = row.project_code;
        showConfirm(`Delete ALL timesheet data for project "${code}"?\n\nThis removes ${row.uploads} upload${row.uploads !== 1 ? 's' : ''} (${this.fmtCount(row.total_rows)} rows). This cannot be undone.`,
          async () => {
            if (row._loading) return;
            row._loading = true;
            this.error = null;
            try {
              await Api.timesheets.delete(code);
              this.rows = this.rows.filter(r => r !== row);
              await this.loadRows();
            } catch (e) {
              this.error = e.message || 'Delete failed.';
              row._loading = false;
            }
          }, null, 'Delete actuals');
      },
      async viewRows(r) {
        this._returnFocus = document.activeElement;
        this.modal = { show: true, loading: true, code: r.project_code, rows: [], currency: r.currency || null };
        this.$nextTick(() => { const c = document.querySelector('.ts-view .ts-close'); if (c) c.focus(); });
        try {
          const records = await Api.timesheets.get(r.project_code);
          // each record has a .data array; flatten all uploads
          const flat = records.flatMap(rec => rec.data || []);
          flat.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
          this.modal.rows = flat;
        } catch (e) {
          this.error = e.message || 'Failed to load rows.';
          this.modal.show = false;
        } finally {
          this.modal.loading = false;
        }
      },
      async downloadXlsx(r) {
        if (r._downloading) return;
        r._downloading = true;
        const code = r.project_code;
        try {
          const records = await Api.timesheets.get(code);
          const flat = records.flatMap(rec => rec.data || []);
          flat.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
          const wb = new ExcelJS.Workbook();
          const ws = wb.addWorksheet(code);
          const header = ['Date', 'Owner', 'Role', 'Task', 'Hours', 'Notes', 'Fee', 'Spent'];
          ws.addRow(header).font = { bold: true };
          flat.forEach(row => {
            const fee = row.fee || 0;
            ws.addRow([row.date, row.owner, row.role, row.task, row.hours,
                       row.notes, fee, fee * (row.hours || 0)]);
          });
          ws.columns = [
            { width: 12 }, { width: 20 }, { width: 18 }, { width: 24 },
            { width: 10 }, { width: 30 }, { width: 12 }, { width: 12 },
          ];
          ws.views = [{ state: 'frozen', ySplit: 1 }];
          const buffer = await wb.xlsx.writeBuffer();
          const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = this.buildXlsxFilename(r);
          a.click();
          // Deferred: some browsers (Safari, older Firefox/Chromium) process the
          // click-to-download hand-off asynchronously — revoking synchronously can
          // invalidate the blob before the download actually starts.
          setTimeout(() => URL.revokeObjectURL(a.href), 0);
        } catch (e) {
          this.error = e.message || 'Export failed.';
        } finally {
          r._downloading = false;
        }
      },
      fmtCount(n) { return (Number(n) || 0).toLocaleString('en-US'); },
      fmtDate(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      },
      // Filesystem-safe filename part: spaces become '-', characters invalid in
      // Windows/macOS filenames are stripped (client/project names are free text
      // and can contain ':', '/', etc. — e.g. "NH-26-...:AnnualUpdate").
      sanitizeForFilename(s) {
        return String(s || '').trim().replace(/\s+/g, '-').replace(/[\\/:*?"<>|]/g, '');
      },
      buildXlsxFilename(r) {
        const client = this.sanitizeForFilename(r.client_name || 'NoClient');
        const project = this.sanitizeForFilename(r.project_name || 'NoProject');
        const code = this.sanitizeForFilename(r.project_code);
        const now = new Date();
        const yyyymmdd = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
        return `${client}_${project}_${code}_${yyyymmdd}.xlsx`;
      },
    },
  });
  app.component('ph-icon', window.PhIcon);
  app.mount('#app');
</script>
