events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server {
    listen 80;

    # nginx has no visibility into Docker's external port mapping (it only ever
    # sees its own internal listen port, 80) — an absolute redirect nginx builds
    # itself would always lose the real port the client connected on. Leaving the
    # Location header relative lets the browser (which does know the real URL)
    # resolve it correctly, port included.
    absolute_redirect off;

    # ── AUTH SUBREQUEST ────────────────────────────────────────────────────────
    # nginx sends a HEAD-style subrequest here before serving protected content.
    # The API reads the httpOnly JWT cookie and returns 200 (ok) or 401 (not auth).
    location = /auth-check {
      internal;
      proxy_pass              http://api:3000/api/auth/me;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length "";
      proxy_set_header        X-Original-URI $request_uri;
      proxy_connect_timeout   5s;
      proxy_read_timeout      10s;
    }

    # Same subrequest, but the API answers 204 only to an admin or sysadmin
    # (403 to a user, 401 without a session). Guards handbook/restricted/.
    location = /admin-check {
      internal;
      proxy_pass              http://api:3000/api/auth/admin-check;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length "";
      proxy_set_header        X-Original-URI $request_uri;
      proxy_connect_timeout   5s;
      proxy_read_timeout      10s;
    }

    # ── REDIRECT TARGET ────────────────────────────────────────────────────────
    location @to_login {
      return 302 /login.html;
    }

    # ── SSE ENDPOINT (buffering must be off for EventSource to work) ─────────────
    location = /api/notifications/stream {
      proxy_pass         http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Connection        '';
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 3600s;
      chunked_transfer_encoding on;
    }

    # ── API PROXY (no nginx-level auth — API guards itself) ────────────────────
    location /api/ {
      proxy_pass            http://api:3000;
      proxy_http_version    1.1;
      proxy_set_header      Host              $host;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      Connection        '';
      proxy_connect_timeout 10s;
      proxy_read_timeout    60s;
    }

    # ── SITE FILES ONLY ────────────────────────────────────────────────────────
    # docker-compose.yml mounts the whole repo root, .env and backups/ included.
    # Only what a location below lists is served (root pages, css/ and js/ assets,
    # handbook/); every other path is 404.
    # scripts/nginx-serve.test.js checks every tracked file against this.

    # ── PUBLIC PAGES (no auth) ─────────────────────────────────────────────────
    location ~ ^/(login|activate|reset-password)\.html$ {
      root /usr/share/nginx/html;
    }

    # ── DEV-ONLY TESTS under js/ — must precede the assets location ────────────
    # Case-insensitive: the repo can sit on a case-insensitive filesystem, where
    # /js/lib/x.Test.js reaches the real x.test.js.
    location ~* ^/js/.+\.(test|spec)\.js$ { return 404; }

    # ── PUBLIC ASSETS (no auth — needed by login/activate pages) ──────────────
    # No `~` in the path: a Windows short (8.3) name such as MONEYT~1.js would
    # reach a test file past the rule above.
    location ~ ^/(css|js)/[A-Za-z0-9_./-]+\.(css|js)$ {
      root /usr/share/nginx/html;
    }

    # ── PROTECTED APP (valid JWT cookie required) ──────────────────────────────
    location = / {
      auth_request  /auth-check;
      error_page 401 = @to_login;

      root  /usr/share/nginx/html;
      try_files /index.html =404;
    }

    # ── HANDBOOK (help.html reads these) ───────────────────────────────────────
    # The two patterns are disjoint and case-sensitive, and the character class has
    # no `~`: a case variant or a Windows short (8.3) name such as RESTRI~1 reaches
    # the final 404, never restricted/. A user gets the 403 of /admin-check.
    location ~ ^/handbook/restricted/[A-Za-z0-9_./-]+\.(md|png)$ {
      auth_request  /admin-check;
      error_page 401 = @to_login;

      root  /usr/share/nginx/html;
    }

    location ~ ^/handbook/(public/[A-Za-z0-9_./-]+\.(md|png)|manifest\.json)$ {
      auth_request  /auth-check;
      error_page 401 = @to_login;

      root  /usr/share/nginx/html;
    }

    # The viewer replaced test-cases.html; the exact match wins over the page rule below.
    location = /test-cases.html { return 301 /help.html?doc=test-cases; }

    location ~ ^/[A-Za-z0-9_-]+\.html$ {
      auth_request  /auth-check;
      error_page 401 = @to_login;

      root  /usr/share/nginx/html;
      try_files $uri =404;
    }

    # ── EVERYTHING ELSE ────────────────────────────────────────────────────────
    location / { return 404; }
  }
}
