<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/sidebar-state.js?v=1"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDash — Privacy Notice</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B1840'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Segoe UI,Arial,sans-serif' font-size='42' font-weight='700' fill='%23F0287A'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="css/tokens.css?v=14">
  <link rel="stylesheet" href="css/style.css?v=38">
  <link rel="stylesheet" href="css/admin-crud.css?v=6">
  <style>
    .pn-doc {
      background: var(--surface-white);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 2rem 2.5rem;
      max-width: 780px;
      margin: 0 auto 3rem;
    }
    .pn-body { overflow-wrap: anywhere; overflow-x: auto; }
    .pn-body iframe, .pn-body video, .pn-body svg, .pn-body embed, .pn-body object { max-width: 100%; }
    .pn-body h1, .pn-body h2, .pn-body h3 { color: var(--brand-navy); font-weight: 700; }
    .pn-body h2 { font-size: 1.05rem; margin-top: 1.6rem; margin-bottom: .5rem; }
    .pn-body p, .pn-body li { font-size: .92rem; color: var(--text-body); line-height: 1.7; }
    .pn-body img { max-width: 100%; height: auto; }
    .pn-body table { display: block; max-width: 100%; overflow-x: auto; }
    .pn-message { color: var(--text-muted); font-size: .92rem; margin: 0; }
    .pn-footer {
      margin: 2rem 0 0;
      padding-top: 1rem;
      border-top: 1px solid var(--border-light);
      color: var(--text-muted);
      font-size: .82rem;
    }
    @media (max-width: 575.98px) { .pn-doc { padding: 1.25rem 1rem; } }
  </style>
</head>
<body>

<!-- Navbar (injected by nav.js) -->
<div id="app-shell">
<div id="nav-container"></div>
<div id="app-main">

<div id="app" v-cloak>

  <div v-if="ready" class="page app-container">
    <div class="ph">
      <div class="ph-main">
        <div class="ph-title-row"><h1 class="ph-title">Privacy Notice</h1></div>
      </div>
    </div>

    <div class="pn-doc">
      <div v-if="loading" class="d-flex justify-content-center py-4">
        <div class="spinner-border text-secondary"></div>
      </div>
      <p v-else-if="loadError" class="pn-message">{{ loadError }}</p>
      <p v-else-if="!content" class="pn-message">No privacy notice has been published yet.</p>
      <template v-else>
        <div class="pn-body" v-html="safeContent"></div>
        <p class="pn-footer">{{ footerLine }}</p>
      </template>
    </div>
  </div>

  <div v-else class="d-flex align-items-center justify-content-center" style="height:60vh">
    <div class="spinner-border text-secondary"></div>
  </div>

</div>

</div><!-- /#app-main -->
</div><!-- /#app-shell -->

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/vue@3.5.45/dist/vue.global.prod.js" integrity="sha384-K2FjvpG1y48yCE+7CBPhnKc16ShPmT3dlNwvoA3dhjV18+L5ugI0P8PWPvdjm/Fa" crossorigin="anonymous"></script>
<script defer src="js/api.js?v=22"></script>
<script defer src="js/core.js?v=17"></script>
<script type="module" src="js/lib/notif-browser.js?v=2"></script>
<script type="module" src="js/lib/notification-url.js?v=1"></script>
<script defer src="js/notifications.js?v=7"></script>
<script type="module" src="js/lib/icons.js?v=7"></script>
<script type="module" src="js/lib/dates.js?v=7"></script>
<script type="module" src="js/lib/save.js?v=4"></script>
<script defer src="js/nav.js?v=25"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.18/dist/purify.min.js" integrity="sha384-lkArbWjiZKuE+bzKbj1vOEF7DKYBDNvgwZMCt5OH8bdRB92zpzyNska9Q/XKPHQD" crossorigin="anonymous"></script>
<script type="module" src="js/lib/terms-html.js?v=1"></script>
<script type="module" src="js/pages/privacy-notice.js?v=1"></script>
</body>
</html>
